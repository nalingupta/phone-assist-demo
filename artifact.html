de\": true,\n    \"sent\": true,\n    \"to\": \"(***) ***-\u003clast 4 digits of the phone on file>\",\n    \"code_demo_only\": \"\u003cnew random six-digit code>\",\n    \"expires_in\": \"5 minutes\"\n}\n\nverify_otp(\n    desc=\"Check the six-digit passcode the caller reads back\",\n    input=\"code\",\n    message=\"Checking the passcode\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"verified\": true,\n    \"method\": \"SMS one-time passcode\",\n    \"note\": \"Caller may now discuss prescriptions and claims\"\n}\n\nlookup_rx(\n    desc=\"List the patient's prescriptions with refill counts and status, or find one by number or drug name\",\n    input=\"patient, query?\",\n    message=\"Looking up prescriptions\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"found\": 1,\n    \"prescriptions\": [\n        {\"rx\": \"\u003crx number from the record>\", \"drug\": \"\u003cdrug and strength from the record>\", \"refills_left\": 1, \"last_fill\": \"\u003cMM/DD/YYYY from the record>\", \"status\": \"\u003cstatus from the record>\"}\n    ]\n}\n\ncheck_insurance(\n    desc=\"Check plan status, the latest claim result and rejection reason, days' supply used, and 30-day versus 90-day copays for a prescription\",\n    input=\"memberId, rx\",\n    message=\"Checking insurance\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"plan\": \"\u003cplan name from the record>\",\n    \"plan_status\": \"\u003cplan status from the record>\",\n    \"latest_claim\": \"\u003clatest claim result for this prescription, with the reason if it was rejected>\",\n    \"days_supply_used\": \"\u003cpercent of the last fill's days' supply used as of today>\",\n    \"eligible_date\": \"\u003cMM/DD/YYYY the next fill is covered, or Eligible now>\",\n    \"copay_30_day\": \"\u003c30-day copay from the record>\",\n    \"copay_90_day\": \"\u003c90-day copay from the record>\",\n    \"prior_authorization\": \"\u003cRequired or Not required>\"\n}\n\nget_rx_status(\n    desc=\"Get a prescription's fill status and the estimated ready time at the store filling it\",\n    input=\"rx, store?\",\n    message=\"Checking the prescription status\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"rx\": \"\u003crx number>\",\n    \"status\": \"\u003cfill status>\",\n    \"estimated_ready_time\": \"\u003cday and time it will be ready, or why it is not scheduled>\",\n    \"store\": \"\u003cstore name and number>\"\n}\n\ncheck_prescriber_authorization(\n    desc=\"Check the days' supply the prescriber has authorized and whether a request to the prescriber is pending\",\n    input=\"rx\",\n    message=\"Checking prescriber authorization\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"rx\": \"\u003crx number>\",\n    \"prescriber\": \"\u003cprescriber from the record>\",\n    \"authorized_days_supply\": \"\u003c30 or 90>\",\n    \"refills_authorized\": 1,\n    \"pending_request\": false,\n    \"requested_on\": \"\",\n    \"status\": \"\u003cauthorization status and how long it lasts>\"\n}\n\ncheck_delivery_eligibility(\n    desc=\"Check whether a prescription can be delivered to the patient's address, and the alternatives when it cannot\",\n    input=\"rx, address?\",\n    message=\"Checking delivery eligibility\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"rx\": \"\u003crx number>\",\n    \"eligible\": true,\n    \"reason\": \"\u003cwhy it can or cannot be delivered>\",\n    \"delivery_window\": \"\u003cday and time window>\",\n    \"fee\": \"\u003cdelivery fee>\",\n    \"alternatives\": [\"\u003canother way to get it>\"]\n}\n\nfind_stores(\n    desc=\"Find Walgreens stores near a ZIP code or address, with pharmacy hours and distance\",\n    input=\"location, service?\",\n    message=\"Finding nearby stores\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"location\": \"\u003cZIP code or address searched>\",\n    \"stores\": [\n        {\"store\": \"\u003cWalgreens store name and number>\", \"address\": \"\u003cstreet address>\", \"distance\": \"\u003cmiles>\", \"pharmacy_hours\": \"\u003cpharmacy hours>\"}\n    ]\n}\n\nget_disclosure(\n    desc=\"Get the approved verbatim script for a required disclosure or consent, such as SMS prescription alerts\",\n    input=\"topic\",\n    message=\"Getting the approved disclosure\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"topic\": \"\u003cdisclosure topic>\",\n    \"disclosure_text\": \"\u003cthe approved script, word for word, ending with the consent question when consent is needed>\",\n    \"requires_consent\": true,\n    \"source\": \"\u003cpolicy file name in kb/>\"\n}\n\nlookup_policy(\n    desc=\"Look up a company policy that the knowledge base does not cover, such as returns, delivery or pickup by someone else\",\n    input=\"topic\",\n    message=\"Looking up the policy\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"topic\": \"\u003cpolicy topic>\",\n    \"policy\": \"\u003cthe policy in one or two sentences>\",\n    \"applies_to\": \"\u003cwhat it covers>\",\n    \"source\": \"\u003cpolicy file name in kb/>\"\n}\n\nfind_pharmacy(\n    desc=\"Look up another pharmacy (CVS, Walgreens or any other chain) by name and location, with its phone number for a transfer\",\n    input=\"name, location\",\n    message=\"Looking up the pharmacy\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"pharmacy\": \"\u003cpharmacy name>\",\n    \"address\": \"\u003cstreet, city, state ZIP>\",\n    \"phone\": \"\u003cphone number>\",\n    \"fax\": \"\u003cfax number>\",\n    \"npi\": \"\u003c10-digit NPI>\",\n    \"pharmacy_hours\": \"\u003cpharmacy hours>\"\n}\n\ncheck_transfer_status(\n    desc=\"Check where a submitted prescription transfer stands and when it is expected to be ready\",\n    input=\"transfer_id\",\n    message=\"Checking the transfer\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"transfer_id\": \"\u003ctransfer id from the submitted transfer>\",\n    \"status\": \"\u003cwhere the transfer stands>\",\n    \"expected_ready\": \"\u003cwhen it is expected to be ready, per the transfer policy>\",\n    \"to\": \"\u003creceiving store name and number>\"\n}\n\nverify_representative(\n    desc=\"Check whether a caller who is not the patient is listed as an authorized representative on the patient's record\",\n    input=\"patient, representative, relationship\",\n    message=\"Checking the representative\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"patient\": \"\u003cpatient full name>\",\n    \"representative\": \"\u003crepresentative full name>\",\n    \"relationship\": \"\u003crelationship to the patient>\",\n    \"authorized\": true,\n    \"scope\": \"\u003cwhat the representative may handle>\",\n    \"on_file_since\": \"\u003cMM/DD/YYYY>\"\n}\n\ncheck_savings_options(\n    desc=\"Check manufacturer coupons, discount cards and plan options for a prescription, and whether each can be used with the patient's plan\",\n    input=\"rx\",\n    message=\"Checking savings options\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"rx\": \"\u003crx number>\",\n    \"manufacturer_coupon\": \"\u003cavailable coupon, or why none applies>\",\n    \"coupon_with_plan\": \"\u003cwhether the coupon can be combined with this plan>\",\n    \"discount_card_price\": \"\u003cdiscount card price and days' supply>\",\n    \"best_option\": \"\u003cthe cheapest valid option and its price>\",\n    \"source\": \"\u003cpolicy file name in kb/>\"\n}\n\nrequest_refill(\n    desc=\"Submit a refill request for a prescription at a store, optionally as a different days' supply\",\n    input=\"rx, store, days?\",\n    message=\"Requesting the refill\",\n    dynamic=true,\n    auto_approved=false\n) -> {\n    \"demo_mode\": true,\n    \"request\": \"Submitted\",\n    \"rx\": \"\u003crx number>\",\n    \"store\": \"\u003cpickup store name and number>\",\n    \"days_supply\": \"\u003c30 or 90>\",\n    \"estimated_ready\": \"\u003cday and time it will be ready>\"\n}\n\nupdate_patient_preferences(\n    desc=\"Update the patient's contact channel for notifications or their preferred days' supply on file\",\n    input=\"patient, contact_channel?, fill_days?\",\n    message=\"Updating preferences\",\n    dynamic=true,\n    auto_approved=false\n) -> {\n    \"demo_mode\": true,\n    \"patient\": \"\u003cpatient full name>\",\n    \"contact_channel\": \"\u003cnew contact channel>\",\n    \"fill_days\": \"\u003c30 or 90>\",\n    \"updated\": true\n}\n\nrerun_claim(\n    desc=\"Resubmit the insurance claim for a prescription, optionally as a 90-day supply\",\n    input=\"rx, days\",\n    message=\"Rerunning the claim\",\n    dynamic=true,\n    auto_approved=false\n) -> {\n    \"demo_mode\": true,\n    \"result\": \"\u003cclaim result>\",\n    \"days_supply\": \"\u003c30 or 90>\",\n    \"copay\": \"\u003ccopay for that supply, from the record>\",\n    \"ready_for_pickup\": \"\u003cday and time it will be ready>\",\n    \"store\": \"\u003cpickup store name and number>\"\n}\n\nvaccine_slots(\n    desc=\"Check vaccine eligibility and coverage for the patient and list open appointment slots at a store\",\n    input=\"store, vaccine, date?\",\n    message=\"Finding vaccine slots\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"eligible\": true,\n    \"last_dose\": \"\u003cMM/DD/YYYY from the record, or None on file>\",\n    \"coverage\": \"\u003cwhat the plan covers>\",\n    \"open_slots\": [\"\u003ctime>\", \"\u003ctime>\", \"\u003ctime>\"],\n    \"walk_in_wait\": \"\u003ccurrent walk-in wait>\"\n}\n\nbook_appointment(\n    desc=\"Book a vaccine appointment slot for the patient at a store\",\n    input=\"patient, store, vaccine, slot\",\n    message=\"Booking the appointment\",\n    dynamic=true,\n    auto_approved=false\n) -> {\n    \"demo_mode\": true,\n    \"confirmation\": \"\u003cconfirmation number>\",\n    \"when\": \"\u003cday and time booked>\",\n    \"where\": \"\u003cstore name and number>\",\n    \"bring\": \"\u003cwhat to bring>\",\n    \"record\": \"\u003cwhere the shot will be recorded>\"\n}\n\nsend_confirmation(\n    desc=\"Send a confirmation by text message or email using the contact details on file\",\n    input=\"channel, message\",\n    message=\"Sending the confirmation\",\n    dynamic=true,\n    auto_approved=false\n) -> {\n    \"demo_mode\": true,\n    \"sent\": true,\n    \"channel\": \"\u003cSMS or Email>\",\n    \"to\": \"\u003cmasked phone or email on file>\",\n    \"message\": \"\u003cthe confirmation text that was sent>\"\n}\n\nenroll_text_alerts(\n    desc=\"Enroll the patient in automated prescription text alerts after the approved SMS disclosure was read and the caller gave affirmative consent\",\n    input=\"phone, consent\",\n    message=\"Enrolling in text alerts\",\n    dynamic=true,\n    auto_approved=false\n) -> {\n    \"demo_mode\": true,\n    \"enrolled\": true,\n    \"channel\": \"SMS\",\n    \"to\": \"(***) ***-\u003clast 4 digits>\",\n    \"alerts\": \"\u003calert types enrolled>\",\n    \"consent_recorded\": \"\u003chow and when consent was given>\",\n    \"opt_out\": \"Reply STOP to any alert\"\n}\n\ntransfer_rx(\n    desc=\"Move a prescription to another Walgreens store or request a transfer from another pharmacy\",\n    input=\"rx, destination, from?\",\n    message=\"Submitting the transfer\",\n    dynamic=true,\n    auto_approved=false\n) -> {\n    \"demo_mode\": true,\n    \"request\": \"Submitted\",\n    \"transfer_id\": \"\u003cnew transfer id>\",\n    \"to\": \"\u003creceiving store name and number>\",\n    \"ready\": \"\u003cwhen it is expected to be ready, per the transfer policy>\"\n}\n\npage_pharmacist(\n    desc=\"Warm-transfer the call to the on-duty pharmacist for a clinical question while the agent stays on the line\",\n    input=\"patient, reason\",\n    message=\"Paging the pharmacist\",\n    dynamic=true,\n    auto_approved=false\n) -> {\n    \"demo_mode\": true,\n    \"status\": \"Pharmacist paged\",\n    \"pharmacist\": \"\u003con-duty pharmacist name>, PharmD\",\n    \"joining_in\": \"\u003cabout how long until they join>\",\n    \"reason\": \"\u003cthe clinical question, in a few words>\"\n}\n\nlog_summary(\n    desc=\"Write the call summary to the interaction record\",\n    input=\"summary\",\n    message=\"Logging the call\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"logged\": true,\n    \"interaction_id\": \"\u003cnew interaction id>\",\n    \"summary\": \"\u003cone-line summary of what was resolved on this call>\"\n}\n","kb":[{"file":"cost_and_savings.md","text":"# Cost and savings options\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nA 90-day supply usually carries a lower combined copay than three 30-day fills; quote both from the insurance check before offering. A 90-day conversion uses the remaining refills on the prescription, so no new prescription is needed while refills remain.\n\nManufacturer coupons cannot be combined with federal plans such as Medicare Part D or Medicaid. A discount card can be used instead of insurance on a given fill, but the two cannot be stacked on the same fill.\n\nGeneric substitution is automatic unless the prescriber marked \"dispense as written\".\n\nAgents may quote prices from the insurance check only, never from memory.\n"},{"file":"escalation_and_sensitive_topics.md","text":"# Escalation and sensitive topics\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nAgents do not give clinical advice. Questions about dosing, side effects, drug interactions, pregnancy or missed doses are warm-transferred to the pharmacist; tell the caller a pharmacist will join and expect a wait of up to 5 minutes.\n\nBilling disputes above 100 dollars, complaints about staff, and any request involving a deceased patient go to a supervisor. If a caller mentions self-harm, stay on the line and follow the crisis protocol.\n\nTreat mental health, HIV, substance use and reproductive health prescriptions as sensitive: confirm the caller is the patient before naming the medication.\n"},{"file":"identity_verification.md","text":"# Caller identity verification\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nBefore any prescription, claim or health detail is discussed, verify the caller with two identifiers from the patient record (full name and date of birth) plus the phone number on file. Ask the caller to state each one; never read the record's values to them for a yes or no. Then send a one-time passcode to the phone on file and have the caller read it back.\n\nA prescription number from another pharmacy (for example a CVS Rx number) is not on the Walgreens record and never verifies identity. It is used only to request a transfer, after the caller is verified; the drug name and the other pharmacy's location are enough when the caller does not have it.\n\nIf the caller is not the patient, they must be listed as an authorized representative on the record; otherwise offer to call the patient directly.\n\nNever confirm or deny that a prescription exists before verification is complete. Agents may say that they are verifying identity for privacy reasons.\n"},{"file":"immunization_services.md","text":"# Immunization services\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nPharmacists give flu shots to patients aged 3 and up, by appointment or walk-in, during pharmacy hours. Most commercial plans and Medicare Part B cover the seasonal flu vaccine at no cost; confirm coverage from the vaccine eligibility check.\n\nA flu shot can be given at the same visit as a COVID-19 vaccine. Patients should bring an insurance card and photo ID. The immunization record is available in the app and sent to the state registry within 24 hours.\n\nPatients 65 and older are offered the high-dose formulation. Clinical questions about reactions or contraindications go to the pharmacist.\n"},{"file":"insurance_rejection_codes.md","text":"# Insurance rejection codes\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\n- Code 70, product not covered: offer the covered alternative or a cash price.\n- Code 75, prior authorization required: the prescriber must submit the authorization; typical turnaround is 2 to 3 business days.\n- Code 76, plan limit exceeded: the quantity or days' supply is above the plan limit; offer the covered quantity.\n- Code 79, refill too soon: a timing rejection, not a coverage problem; give the eligible date.\n- Code 88, drug utilization review: a safety flag that the pharmacist must review before the claim can be rerun.\n\nAlways read the rejection reason back to the caller in plain words before rerunning a claim.\n"},{"file":"prescription_transfers.md","text":"# Prescription transfers\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nPrescriptions move between Walgreens stores instantly; the receiving store can usually fill within 15 minutes of the request.\n\nTransfers from another pharmacy chain take 1 to 2 business days because the pharmacist must contact the other pharmacy.\n\nControlled substances in Schedule II cannot be transferred and need a new prescription; Schedules III to V can be transferred once.\n\nTo start a transfer, confirm the receiving store, the prescription number or medication name, and the current pharmacy's phone number.\n"},{"file":"refill_timing.md","text":"# Refill timing rules\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nInsurance plans reject a refill as \"refill too soon\" (rejection code 79) when too little of the current supply has been used. For non-controlled medications the plan pays once about 75 percent of the days' supply is used; for controlled substances it is 90 percent.\n\nThe eligible date is counted from the last fill date, so a 30-day fill picked up on September 21 becomes eligible on October 24.\n\nEarly refills for travel (\"vacation supply\") need a one-time override that the pharmacist requests from the plan; agents should not promise an override.\n\nConverting to a 90-day supply is processed as a new claim and is not blocked by the refill-too-soon window when the prescription has refills remaining.\n"}],"scenarios":[{"file":"01_refill_rejected.md","text":"\u003c!-- One scenario per file. \"customer:\" links it to a record in data.js (USERS).\n     \"## Caller\" is given only to the caller AI; \"## Support agent\" only to the support agent AI. -->\n\n# Refill rejected by insurance, price-sensitive, flu shot add-on\n\ncustomer: maria\n\n## Caller\n\nYou are Maria Lopez, 45, friendly but rushed. You are calling the Walgreens Main St pharmacy from your cell.\n\nSituation: you tried to refill your cholesterol medication (atorvastatin) in the Walgreens app and it said the insurance rejected it. You leave for a work trip on Saturday morning and really need it before then. You have not changed your insurance.\n\nWhat you know, to give when asked:\n- Date of birth: March 14, 1981.\n- Phone on the account: the number you are calling from, (312) 555-0142.\n\nHow you behave:\n- You open with the rejected refill and that you need it before the weekend.\n- If the agent explains the rejection, you mention that the $30 copay every month is adding up.\n- If a cheaper or faster option is offered, you take it.\n- Once the medication is sorted, you remember you also want a flu shot when you pick it up (your daughter's school wants the family's records). Any slot late this afternoon works; pick the earliest one offered.\n- Main Street is the store you use. You are happy to get a text confirmation.\n\n## Support agent\n\nNo deliberate mistakes in this call: follow the guidance and the workflows.\n"},{"file":"02_transfer_from_cvs.md","text":"# Transfer from CVS on Medicare, coupon question\n\ncustomer: james\n\n## Caller\n\nYou are James Carter, 68, polite and a little hard of hearing. You sometimes ask the agent to repeat numbers. You are calling the Walgreens Lincoln Ave pharmacy.\n\nSituation: a couple of weeks ago you called about moving your blood thinner (Eliquis, also called apixaban) from CVS to Walgreens and were told to call back with the CVS prescription number. You have it now.\n\nWhat you know, to give when asked:\n- Date of birth: November 2, 1957.\n- Phone on the account: (773) 555-0188.\n- CVS prescription number: 33178802. It is for the transfer; give it when the agent asks about the prescription to move.\n- Your old pharmacy is the CVS on North Clark Street in Chicago, near Belmont. You do not know its phone number.\n- You want it at Lincoln Avenue.\n\nHow you behave:\n- You open by saying you are calling back to move the blood thinner from CVS.\n- When the agent tells you when it will be ready, you thank them and say you will pick it up then.\n- Once the transfer is handled, you ask whether you can use the coupon card the Eliquis company mailed you, since it is getting expensive.\n- If a cheaper plan option is offered, you accept it.\n- For notifications, a text is fine because your daughter Lauren helps you with those.\n\n## Support agent\n\nNo deliberate mistakes in this call: follow the guidance and the workflows.\n"},{"file":"03_inhaler_red_flag.md","text":"# Inhaler moved to another store, clinical red flag escalated to the pharmacist\n\ncustomer: priya\n\n## Caller\n\nYou are Priya Nair, 32, a new Walgreens patient. You are calling the Walgreens Main St pharmacy on your lunch break.\n\nSituation: you need your albuterol inhaler refilled, and you would like to pick it up at the Davis Street store because it is next to your office.\n\nWhat you know, to give when asked:\n- Date of birth: July 30, 1994.\n- Phone on the account: (224) 555-0167.\n\nHow you behave:\n- You open with the refill and the Davis Street pickup.\n- Once the pickup is sorted, you mention, a little worried, that you have needed the inhaler a lot more this week, five or six times a day, and that you feel a bit tight in the chest. You ask whether it is okay to keep using it that much.\n- If the agent offers a pharmacist, you gladly wait on the line.\n- You prefer email for notifications.\n\n## Support agent\n\nNo deliberate mistakes in this call: follow the guidance and the workflows.\n"},{"file":"04_refill_pickup_davis.md","text":"# Refill before a trip, picked up at another store\n\ncustomer: maria\n\n## Caller\n\nYou are Maria Lopez, 45, calling the Walgreens Main St pharmacy from work, a bit pressed for time.\n\nSituation: you need your metformin refilled before you leave on a work trip Saturday morning. This week you are working out of the office on Davis Street, so picking up at the Walgreens on Davis Street on Friday would be much easier than Main Street.\n\nWhat you know, to give when asked:\n- Date of birth: March 14, 1981.\n- Phone on the account: (312) 555-0142.\n\nHow you behave:\n- You open by asking to refill your metformin before your trip.\n- When the agent asks where and when you will pick it up, you say the Walgreens on Davis Street, Friday afternoon.\n- A text when it is ready is welcome.\n\n## Support agent\n\nNo deliberate mistakes in this call: follow the guidance and the workflows.\n"},{"file":"05_representative_pharmacist.md","text":"# Daughter calls for her father, refill plus a question for the pharmacist\n\ncustomer: james\n\n## Caller\n\nYou are Lauren Carter, 41, calling the Walgreens Lincoln Ave pharmacy on behalf of your father, James Carter. You are listed on his record as his authorized representative. You are organized and a little worried about him.\n\nSituation: your dad's blood pressure pill (lisinopril) will run out soon and you want to make sure the refill is ready this week. Also, he hurt his back gardening and wants to take ibuprofen for a few days, and you are not sure that is safe with his blood thinner.\n\nWhat you know, to give when asked:\n- Your name: Lauren Carter, his daughter and authorized representative.\n- Your father's date of birth: November 2, 1957.\n- His phone on the account: (773) 555-0188 (he is with you and can read you a texted code).\n\nHow you behave:\n- You open by saying who you are and that you are calling about your dad's refill.\n- Once the refill is handled, you ask whether he can take ibuprofen with his Eliquis.\n- When a pharmacist is offered, you are relieved and wait.\n\n## Support agent\n\nNo deliberate mistakes in this call: follow the guidance and the workflows.\n"}]};</script>

<script>
/* Phone Assist demo: model backend.
   1. "server": localhost (or a host) calls GPT-5.6 Luna through server.mjs.
      The browser never holds the OpenAI or ElevenLabs key.
   2. "sample": the page runs inside a claude.ai artifact viewer and uses the
      viewer's own Claude access (no API key). That host cannot call OpenAI.
   Every prompt is assembled from the files: prompts/system_prompt.md plus one
   task file (phone_assist_workflow.md, phone_assist_guidance.md,
   phone_assist_best_reply.md, chat.md or support_agent.md),
   with tools.md, kb/*.md and the customer record attached as reference.
   The simulated caller gets only caller.md and its scenarios/*.md section. */
(function (global) {
  'use strict';

  const STEP_STATUS = ['pending', 'done', 'missed'];

  const WORKFLOW_SCHEMA = {
    type: 'object',
    properties: {
      workflows: {
        type: 'array',
        description: 'Every workflow shown on screen, in order, each with all of its steps.',
        items: {
          type: 'object',
          properties: {
            name: { type: 'string' },
            steps: { type: 'array', items: { type: 'object', properties: { label: { type: 'string' }, status: { type: 'string', enum: STEP_STATUS } }, required: ['label', 'status'], additionalProperties: false } }
          },
          required: ['name', 'steps'], additionalProperties: false
        }
      }
    },
    required: ['workflows'],
    additionalProperties: false
  };
  const GUIDANCE_SCHEMA = {
    type: 'object',
    properties: {
      tags: { type: 'array', items: { type: 'string' } },
      guidance: {
        type: 'array',
        items: {
          type: 'object',
          properties: {
            kind: { type: 'string', description: 'The guidance type name defined in your instructions.' },
            text: { type: 'string' },
            bullets: { type: 'array', items: { type: 'string' } },
            source: { type: 'string' }
          },
          required: ['kind', 'text', 'bullets', 'source'], additionalProperties: false
        }
      },
      tools: {
        type: 'array',
        description: 'Tools to highlight, most useful first, each with its inputs prefilled; value is "" when unknown.',
        items: {
          type: 'object',
          properties: {
            name: { type: 'string' },
            inputs: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, value: { type: 'string' } }, required: ['name', 'value'], additionalProperties: false } }
          },
          required: ['name', 'inputs'], additionalProperties: false
        }
      },
      suggestedTool: { type: 'string', description: 'Name of the one tool the agent should run right now, or "".' },
      autoTask: { type: 'string', description: 'Short goal of a task to handle now with auto-approved tools, or "".' }
    },
    required: ['tags', 'guidance', 'tools', 'suggestedTool', 'autoTask'],
    additionalProperties: false
  };
  const STEP_SCHEMA = {
    type: 'object',
    properties: {
      action: { type: 'string', enum: ['call_tool', 'finish'] },
      tool: { type: 'string', description: 'Tool to call when action is call_tool, else "".' },
      inputs: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, value: { type: 'string' } }, required: ['name', 'value'], additionalProperties: false } },
      summary: {
        type: 'object',
        description: 'The final finding when action is finish; empty strings and rows otherwise.',
        properties: {
          title: { type: 'string' },
          rows: { type: 'array', items: { type: 'object', properties: { label: { type: 'string' }, value: { type: 'string' } }, required: ['label', 'value'], additionalProperties: false } },
          note: { type: 'string' }
        },
        required: ['title', 'rows', 'note'], additionalProperties: false
      }
    },
    required: ['action', 'tool', 'inputs', 'summary'],
    additionalProperties: false
  };
  const CALLER_SCHEMA = {
    type: 'object',
    properties: { say: { type: 'string' }, end_call: { type: 'boolean' } },
    required: ['say', 'end_call'], additionalProperties: false
  };
  const AGENT_SCHEMA = {
    type: 'object',
    properties: {
      say: { type: 'string' },
      tool: { type: 'string' },
      inputs: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, value: { type: 'string' } }, required: ['name', 'value'], additionalProperties: false } },
      end_call: { type: 'boolean' },
      hand_over: { type: 'boolean' }
    },
    required: ['say', 'tool', 'inputs', 'end_call', 'hand_over'], additionalProperties: false
  };

  const REPLY_SCHEMA = {
    type: 'object',
    properties: { reply: { type: 'string' }, why: { type: 'string' } },
    required: ['reply', 'why'], additionalProperties: false
  };
  const ANSWER_SCHEMA = {
    type: 'object',
    properties: { answer: { type: 'string' }, source: { type: 'string' } },
    required: ['answer', 'source'], additionalProperties: false
  };
  const PING_SCHEMA = { type: 'object', properties: { ok: { type: 'boolean' } }, required: ['ok'], additionalProperties: false };

  /* ---------------- tools.md ---------------- */
  const LABEL_WORDS = { otp: 'OTP', rx: 'Rx', id: 'ID', sms: 'SMS', url: 'URL', dob: 'DOB' };
  function labelFor(name) {
    const words = String(name).replace(/([a-z])([A-Z])/g, '$1_$2').split('_').filter(Boolean);
    return words.map((w, i) => LABEL_WORDS[w.toLowerCase()] || (i === 0 ? w[0].toUpperCase() + w.slice(1) : w.toLowerCase())).join(' ');
  }
  const toolLabel = (name) => String(name).split('_').filter(Boolean).map((w) => LABEL_WORDS[w] || (w[0].toUpperCase() + w.slice(1))).join(' ');

  const stripComments = (text) => String(text || '').replace(/<!--[\s\S]*?-->/g, '').trim();

  function jsonObjectAt(text, start) {
    let depth = 0, inStr = false, esc = false;
    for (let i = start; i < text.length; i++) {
      const ch = text[i];
      if (inStr) {
        if (esc) esc = false;
        else if (ch === '\\') esc = true;
        else if (ch === '"') inStr = false;
        continue;
      }
      if (ch === '"') inStr = true;
      else if (ch === '{') depth++;
      else if (ch === '}' && --depth === 0) return { raw: text.slice(start, i + 1), end: i + 1 };
    }
    return null;
  }

  function withDemoMode(obj) {
    if (!obj || typeof obj !== 'object') return { demo_mode: true };
    if (Array.isArray(obj)) return { demo_mode: true, result: obj };
    const rest = Object.assign({}, obj);
    delete rest.demo_mode;
    return Object.assign({ demo_mode: true }, rest);
  }

  /* Blocks look like: tool_name(\n  desc="...", input="a, b", message="...", dynamic=true\n) -> { example JSON } */
  function parseTools(source) {
    const text = stripComments(source);
    const header = /^([A-Za-z_][A-Za-z0-9_]*)\(\s*\n([\s\S]*?)^\)\s*->\s*/gm;
    const tools = [];
    let m;
    while ((m = header.exec(text))) {
      const args = {};
      for (const line of m[2].split('\n')) {
        const a = line.match(/^\s*(\w+)\s*=\s*("(?:[^"\\]|\\.)*"|true|false)\s*,?\s*$/);
        if (!a) continue;
        args[a[1]] = a[2] === 'true' ? true : a[2] === 'false' ? false : JSON.parse(a[2]);
      }
      const out = text[header.lastIndex] === '{' ? jsonObjectAt(text, header.lastIndex) : null;
      let example = null;
      if (out) {
        try { example = JSON.parse(out.raw); } catch (e) { example = null; }
        header.lastIndex = out.end;
      }
      tools.push({
        id: m[1],
        label: toolLabel(m[1]),
        description: String(args.desc || ''),
        message: String(args.message || ''),
        dynamic: args.dynamic !== false,
        autoApproved: args.auto_approved === true,
        inputs: String(args.input || '').split(',').map((s) => s.trim()).filter(Boolean).map((raw) => {
          const optional = raw.endsWith('?');
          const key = optional ? raw.slice(0, -1).trim() : raw;
          return { key, label: labelFor(key), optional };
        }),
        example: withDemoMode(example)
      });
    }
    return tools;
  }

  /* Strict JSON schema shaped like a tool's example output, so a simulated result keeps its keys. */
  function schemaFor(value) {
    if (Array.isArray(value)) return { type: 'array', items: value.length ? schemaFor(value[0]) : { type: 'string' } };
    if (value && typeof value === 'object') {
      const keys = Object.keys(value);
      const properties = {};
      keys.forEach((k) => { properties[k] = schemaFor(value[k]); });
      return { type: 'object', properties, required: keys, additionalProperties: false };
    }
    if (typeof value === 'boolean') return { type: 'boolean' };
    if (typeof value === 'number') return { type: 'number' };
    return { type: 'string' };
  }

  /* ---------------- prompt pieces ---------------- */
  /* The demo's fixed "today", so every prompt and the mock records agree on dates. */
  const DEMO_TODAY = "# Today\nToday is Thursday, October 22, 2026 (10/22/2026). The call is happening now, in the early afternoon.";

  function customerText(user) {
    if (!user) return 'No customer record selected.';
    const rx = user.prescriptions.map((p) => `  - Rx ${p.rx}: ${p.drug}, ${p.sig}, qty ${p.qty}/${p.days} days, ${p.refills} refills left, last fill ${p.lastFill}, prescriber ${p.prescriber}. Status: ${p.status}`).join('\n');
    const imm = user.immunizations.length ? user.immunizations.map((i) => `${i.vaccine} on ${i.date}`).join('; ') : 'none on file';
    const past = user.interactions.map((i) => `${i.date} (${i.channel}): ${i.summary}`).join('; ');
    return [
      `Name: ${user.name}; DOB ${user.dob}; phone ${user.phone}; email ${user.email}; preferred contact ${user.preferredContact}.`,
      `Preferred store: ${user.store.name} ${user.store.id}, ${user.store.address}, hours ${user.store.hours}.`,
      `Insurance: ${user.insurance.plan}, member ${user.insurance.memberId}, status ${user.insurance.status}, copay ${user.insurance.copay30} per 30 days or ${user.insurance.copay90} per 90 days.`,
      `Prescriptions (all on file at ${user.store.name} ${user.store.id}):\n${rx}`,
      `Allergies: ${user.allergies.join(', ')}. Immunizations: ${imm}.`,
      `Previous interactions: ${past || 'none'}.`,
      `Notes: ${user.notes}`
    ].join('\n');
  }

  function fmtTime(t) {
    const s = Math.max(0, Math.round(t || 0));
    return `[${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}]`;
  }

  function transcriptText(state) {
    if (!state.transcript.length) return '(no lines yet)';
    return state.transcript.map((l) => {
      const who = l.speaker === 'caller' ? 'CALLER' : l.speaker === 'agent' ? 'AGENT' : 'TOOL';
      return `${fmtTime(l.t)} ${who}: ${l.text}`;
    }).join('\n');
  }

  function toolRunsText(state) {
    const runs = state.toolRuns || [];
    if (!runs.length) return 'none';
    return runs.map((r) => `${r.tool}(${JSON.stringify(r.inputs || {})}) -> ${JSON.stringify(r.output || {})}`).join('\n');
  }

  function screenText(state) {
    const wf = state.groups.length
      ? state.groups.map((g) => `- ${g.title}: ${g.steps.map((s, i) => `${i + 1}. ${s.label} [${s.status}]`).join('; ')}`).join('\n')
      : '- none yet';
    const tasks = (state.feed || []).filter((r) => r.type === 'task');
    const taskText = tasks.length
      ? tasks.map((t) => `- "${t.goal}" [${t.status}]${t.summary && t.summary.title ? `: ${t.summary.title}` : ''}`).join('\n')
      : '- none yet';
    return `Workflows on screen:\n${wf}\nTags: ${state.tags.join(', ') || 'none'}.\nTasks you already started:\n${taskText}`;
  }

  function stepsText(task) {
    const done = task.steps.filter((st) => st.status === 'done' || st.status === 'skipped');
    return done.length ? done.map((st) => `${st.tool}(${JSON.stringify(st.inputs)}) -> ${st.status === 'skipped' ? 'not run: the human agent skipped it' : JSON.stringify(st.output)}`).join('\n') : 'none yet';
  }

  function kbText() {
    const kb = AI.files.kb;
    return kb.length ? kb.map((k) => `## ${k.file}\n${stripComments(k.text)}`).join('\n\n') : '(no knowledge-base files)';
  }

  /* system_prompt.md + one personality file, then the reference material. */
  function buildSystem(personality, user) {
    const p = AI.files.prompts;
    return [
      DEMO_TODAY,
      stripComments(p.system_prompt),
      stripComments(p[personality]),
      `# Tools (tools.md)\n${stripComments(AI.files.tools) || '(no tools)'}`,
      `# Knowledge base (kb/)\n${kbText()}`,
      `# Customer record (already looked up for this caller)\n${customerText(user)}`
    ].filter(Boolean).join('\n\n---\n\n');
  }

  /* ---------------- backends ---------------- */
  const EMPTY_FILES = { prompts: {}, tools: '', kb: [], scenarios: [] };

  /* scenarios/*.md: "# Title", "customer: <id>", then "## Caller" and "## Support agent" sections. */
  function parseScenario({ file, text }) {
    const body = stripComments(text || '');
    const customer = (body.match(/^customer:\s*(\S+)/m) || [])[1];
    if (!customer) return null;
    const section = (name) => {
      const m = body.match(new RegExp(`^##\\s+${name}\\s*$([\\s\\S]*?)(?=^##\\s|(?![\\s\\S]))`, 'mi'));
      return m ? m[1].trim() : '';
    };
    return {
      id: file.replace(/\.md$/, ''),
      file,
      title: ((body.match(/^#\s+(.+)$/m) || [])[1] || file).trim(),
      customer,
      caller: section('Caller'),
      agent: section('Support agent')
    };
  }

  /* What the caller hears: spoken lines only, from the caller's point of view. */
  function callerTranscript(state) {
    const lines = state.transcript.filter((l) => l.speaker === 'caller' || l.speaker === 'agent');
    return lines.length ? lines.map((l) => `${l.speaker === 'caller' ? 'YOU' : 'AGENT'}: ${l.text}`).join('\n') : '(the call has just connected)';
  }

  /* Messages the human-only tools sent to the caller's phone (passcodes, confirmations). */
  function phoneTexts(state) {
    const sent = (state.toolRuns || []).filter((r) => (r.tool === 'send_otp' || r.tool === 'send_confirmation') && r.output);
    if (!sent.length) return '(no texts yet)';
    return sent.map((r) => {
      const o = r.output;
      if (r.tool === 'send_otp') return `- Walgreens: your one-time passcode is ${o.code_demo_only || o.code || '(unreadable)'}.`;
      return `- ${o.channel || 'Message'}: ${o.message || 'Walgreens confirmation'}`;
    }).join('\n');
  }

  const AI = {
    mode: 'none',          // 'server' | 'sample' | 'none'
    sample: null,
    server: null,          // /api/config answer when a demo server is behind this page
    files: EMPTY_FILES,    // prompts/*.md, tools.md and kb/*.md
    tools: [],             // tools parsed from tools.md
    scenarios: [],         // scenarios parsed from scenarios/*.md
    settings: {},
    listeners: new Set(),

    onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
    emit() { this.listeners.forEach((fn) => fn(this.status())); },

    configure(settings) {
      this.settings = settings || {};
      this.recompute();
    },

    recompute() {
      if (this.server && this.server.openai) this.mode = 'server';
      else if (this.sample) this.mode = 'sample';
      else this.mode = 'none';
      this.emit();
    },

    setFiles(files) {
      this.files = {
        prompts: (files && files.prompts) || {},
        tools: (files && files.tools) || '',
        kb: Array.isArray(files && files.kb) ? files.kb : [],
        scenarios: Array.isArray(files && files.scenarios) ? files.scenarios : []
      };
      this.tools = parseTools(this.files.tools);
      this.scenarios = this.files.scenarios.map(parseScenario).filter(Boolean);
    },

    async init(settings) {
      this.settings = settings || {};
      if (global.PROMPT_FILES) this.setFiles(global.PROMPT_FILES);   // inlined by build-artifact.sh
      this.recompute();
      if (!global.claude && /^https?:/.test(location.protocol)) {
        try {
          const r = await fetch('api/config', { cache: 'no-store' });
          if (r.ok) { const cfg = await r.json(); if (cfg && typeof cfg === 'object') this.server = cfg; }
        } catch (e) { this.server = null; }
        if (this.server) {
          try {
            const r = await fetch('api/prompts', { cache: 'no-store' });
            if (r.ok) this.setFiles(await r.json());
          } catch (e) { /* keep whatever was inlined */ }
        }
        this.recompute();
      }
      if (global.claude && typeof global.claude.use === 'function') {
        try {
          const s = await global.claude.use('sample');
          this.sample = s || null;
        } catch (e) {
          this.sample = null;
        }
        this.recompute();
      }
    },

    available() { return this.mode !== 'none'; },

    hasVoice() { return !!(this.server && this.server.elevenlabs); },

    status() {
      if (this.mode === 'server') {
        const model = this.server.model === 'gpt-5.6-luna' ? 'GPT-5.6 Luna' : (this.server.model || 'GPT-5.6 Luna');
        return { mode: 'server', label: `${model} connected` + (this.server.elevenlabs ? ' · ElevenLabs voices' : ' · browser voices') + (this.server.build && this.server.build.commit ? ` · build ${this.server.build.commit}` : '') };
      }
      if (this.mode === 'sample') return { mode: 'sample', label: 'Claude connected through this page (no key needed)' };
      if (global.claude) return { mode: 'none', label: 'Claude not available in this viewer; the call plays without AI' };
      if (this.server) return { mode: 'none', label: 'Server has no OpenAI key yet; the call plays without AI' };
      return { mode: 'none', label: 'No AI service behind this page; the call plays without AI' };
    },

    async json({ system, user, schema, tier, effort, maxTokens, signal }) {
      if (this.mode === 'server') {
        let r;
        try {
          r = await fetch('api/llm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ system, user, schema, maxTokens, effort: effort || this.settings.effort || 'low' }), signal });
        } catch (e) { throw new Error('Could not reach the demo server.'); }
        const data = await r.json().catch(() => null);
        if (!r.ok) throw new Error((data && data.error) || `Server error ${r.status}`);
        return data.result;
      }
      if (this.mode === 'sample') {
        const prompt = `${system}\n\n---\n\n${user}\n\nReply with only one JSON object that matches this JSON Schema, no prose and no code fence:\n${JSON.stringify(schema)}`;
        try {
          return await this.sample.json(prompt, { modelTier: tier || this.settings.tier || 'quick', cache: false, signal });
        } catch (e) {
          throw new Error(sampleErrorText(e));
        }
      }
      throw new Error('No AI model is connected.');
    },

    /* Runs at the same time as guidance(): only the workflow panel. */
    workflow(state, user) {
      const prompt = [
        `Call transcript so far (oldest first, [mm:ss] SPEAKER):\n${transcriptText(state)}`,
        `Tool calls so far (name(inputs) -> output):\n${toolRunsText(state)}`,
        `Workflow panel before this update:\n${screenText(state)}`,
        'Update the workflow panel for this moment. Return the JSON object.'
      ].join('\n\n');
      return this.json({ system: buildSystem('phone_assist_workflow', user), user: prompt, schema: WORKFLOW_SCHEMA, maxTokens: 4000 });
    },

    /* Runs at the same time as workflow(): tags, guidance cards, tools and AI tasks. */
    guidance(state, user) {
      const recent = (state.guidance || []).slice(-10);
      const shown = recent.map((c, i) => `${fmtTime(c.t)} ${c.kind}: ${c.text}${i === recent.length - 1 ? '   <- newest card, still on screen' : ''}`).join('\n') || '(none yet)';
      const prompt = [
        `Call transcript so far (oldest first, [mm:ss] SPEAKER):\n${transcriptText(state)}`,
        `Tool calls so far (name(inputs) -> output):\n${toolRunsText(state)}`,
        `Screen before this update:\n${screenText(state)}`,
        `Guidance already shown (oldest first, [mm:ss] since the call started, same clock as the transcript):\n${shown}`,
        'Update the guidance and tools for this moment. Return the JSON object.'
      ].join('\n\n');
      return this.json({ system: buildSystem('phone_assist_guidance', user), user: prompt, schema: GUIDANCE_SCHEMA, maxTokens: 6000 });
    },

    /* Simulated call: the caller's next line. Sees only its scenario, what was said and its phone's texts. */
    callerTurn(state, scenario) {
      const system = [DEMO_TODAY, stripComments(this.files.prompts.caller || ''), `# Your scenario\n${scenario.caller}`].join('\n\n---\n\n');
      const prompt = [
        `The call so far:\n${callerTranscript(state)}`,

/* Phone Assist demo: voice input through the browser's Web Speech API.
   Works in Chrome and Edge. No audio is played back; only you speak. */
(function (global) {
  'use strict';
  const SR = global.SpeechRecognition || global.webkitSpeechRecognition;

  function createRecognizer(handlers) {
    if (!SR) return { supported: false, start() {}, stop() {}, get listening() { return false; } };
    let rec = null;
    let wanted = false;
    let restartTimer = null;

    function makeRec() {
      const r = new SR();
      r.continuous = true;
      r.interimResults = true;
      r.lang = handlers.lang || 'en-US';
      r.maxAlternatives = 1;
      r.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          const txt = res[0].transcript;
          if (res.isFinal) {
            const t = txt.trim();
            if (t) handlers.onFinal(t);
          } else {
            interim += txt;
          }
        }
        handlers.onInterim(interim.trim());
      };
      r.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          wanted = false;
          handlers.onError('Microphone access was blocked. Allow the microphone for this page and try again.');
        } else if (e.error === 'audio-capture') {
          wanted = false;
          handlers.onError('No microphone was found.');
        }
        /* no-speech, network and aborted fall through to onend, which restarts while wanted. */
      };
      r.onend = () => {
        if (wanted) {
          restartTimer = setTimeout(() => {
            try { rec = makeRec(); rec.start(); } catch (err) { wanted = false; handlers.onError(String(err)); handlers.onState('stopped'); }
          }, 150);
        } else {
          handlers.onState('stopped');
        }
      };
      r.onstart = () => handlers.onState('listening');
      return r;
    }

    return {
      supported: true,
      start() {
        if (wanted) return;
        wanted = true;
        try { rec = makeRec(); rec.start(); } catch (err) { wanted = false; handlers.onError(String(err)); }
      },
      stop() {
        wanted = false;
        clearTimeout(restartTimer);
        if (rec) { try { rec.stop(); } catch (e) { /* already stopped */ } }
        handlers.onInterim('');
      },
      get listening() { return wanted; }
    };

<script>
/* Phone Assist demo: reads scripted lines aloud with the browser's built-in
   speech synthesis (Chrome, Edge, Safari). Two distinct voices, no vendor. */
(function (global) {
  'use strict';
  const synth = global.speechSynthesis;
  const supported = !!synth && typeof global.SpeechSynthesisUtterance === 'function';
  let voices = [];
  const keep = [];           // Chrome drops onend if the utterance is garbage collected

  function loadVoices() { if (supported) voices = synth.getVoices() || []; }
  if (supported) {
    loadVoices();
    if (typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', loadVoices);
    else synth.onvoiceschanged = loadVoices;
  }

  const PREF = {
    caller: ['Google UK English Female', 'Karen', 'Moira', 'Tessa', 'Microsoft Zira', 'Microsoft Sonia', 'Samantha', 'Google US English'],
    agent: ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Ava', 'Allison', 'Microsoft Zira', 'Google UK English Female']
  };

  function pick(role) {
    if (!voices.length) loadVoices();
    const en = voices.filter((v) => /^en[-_]/i.test(v.lang));
    const pool = en.length ? en : voices;
    if (!pool.length) return null;
    const find = (names) => { for (const n of names) { const v = pool.find((x) => x.name.includes(n)); if (v) return v; } return null; };
    let v = find(PREF[role] || []);
    const other = find(PREF[role === 'caller' ? 'agent' : 'caller'] || []);
    if (!v) v = role === 'caller' ? pool[0] : (pool[1] || pool[0]);
    if (other && v === other) {                       // make sure the two speakers differ when possible
      const alt = pool.find((x) => x !== other);
      if (alt) v = alt;
    }
    return v;
  }

  function speak(text, role) {
    if (!supported || !text) return Promise.resolve(false);
    return new Promise((resolve) => {
      const u = new global.SpeechSynthesisUtterance(text);
      const v = pick(role);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
      u.rate = role === 'caller' ? 1.0 : 1.03;
      u.pitch = role === 'caller' ? 1.08 : 0.92;
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        const i = keep.indexOf(u); if (i >= 0) keep.splice(i, 1);
        resolve(ok);
      };
      u.onend = () => finish(true);
      u.onerror = () => finish(false);
      keep.push(u);
      synth.cancel();
      setTimeout(() => { try { synth.speak(u); } catch (e) { finish(false); } }, 60);
      setTimeout(() => { if (!done && !synth.speaking && !synth.pending) finish(false); }, 1800);   // no voice available
      setTimeout(() => finish(true), Math.min(40000, 4000 + text.length * 95));                     // never hang
    });
  }

  /* ElevenLabs voices via the demo server (POST api/tts), falling back to the browser. */
  let currentAudio = null;
  let serverVoice = false;
  const audioCache = new Map();
  function useServer(on) { serverVoice = !!on; }

  function speakServer(text, role) {
    return new Promise(async (resolve) => {
      let url = audioCache.get(`${role}|${text}`);
      try {
        if (!url) {
          const r = await fetch('api/tts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, voice: role }) });
          if (!r.ok) return resolve(speak(text, role, true));
          url = URL.createObjectURL(await r.blob());
          audioCache.set(`${role}|${text}`, url);
        }
      } catch (e) { return resolve(speak(text, role, true)); }
      const a = new Audio(url);
      currentAudio = a;
      let done = false;
      const finish = (ok) => { if (done) return; done = true; if (currentAudio === a) currentAudio = null; resolve(ok); };
      a.onended = () => finish(true);
      a.onerror = () => finish(false);
      a.play().catch(() => finish(false));
      setTimeout(() => finish(true), Math.min(60000, 5000 + text.length * 120));
    });
  }

  const speakBrowser = speak;
  function speakAny(text, role, forceBrowser) {
    if (serverVoice && !forceBrowser) return speakServer(text, role);
    return speakBrowser(text, role);
  }

  function cancel() {
    if (currentAudio) { try { currentAudio.pause(); } catch (e) { /* ignore */ } currentAudio = null; }
    if (supported) { try { synth.cancel(); } catch (e) { /* ignore */ } }
  }

  global.TTS = { get supported() { return supported || serverVoice; }, speak: speakAny, cancel, useServer, voices: () => voices };
})(window);
