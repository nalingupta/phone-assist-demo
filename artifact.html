<title>Phone Assist Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Phone Assist demo: Cignara playground look (light, single theme).
   One-screen app: the page never scrolls; each panel scrolls inside itself. */
:root {
  --bg: #f1f1f3; --surface: #ffffff; --panel: #f4f4f6; --panel-2: #e4e4e8;
  --fg: #1c1c1f; --muted: #6e7079; --line: #dcdce1; --line-2: #c9c9cf;
  --accent: #2f6fdb; --ok: #2a9d5c; --warn: #e0861a;
  --chip: #fde1d3; --chip-on: #f7c7ae; --chip-fg: #4a2f21;
  --label: #9b59e0; --say: #cf3d3d; --ask: #8a4fd0; --tell: #c9582b; --info: #2a9d5c; --do: #d98a1c; --rec: #6f52d8; --caution: #d33c2f; --answer: #2f6fdb;
  --btn: #8f93a1; --dark: #101114; --danger: #d33c2f;
  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
h2, h3 { margin: 0; }

/* stage: rail + card fill the viewport */
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; padding: 16px 24px 18px; max-width: 1560px; width: 100%; margin: 0 auto; }
.rail { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; padding-right: 2px; }
.rail-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pill { background: var(--panel-2); border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.live { background: #e3f3e9; color: #1d6f3f; }
.pill.ended { background: #ececef; color: var(--muted); }
.icon-btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; width: 32px; height: 32px; font-size: 16px; flex: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 7px 6px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.rail-btn { border: 0; border-radius: 10px; padding: 12px 14px; background: var(--btn); color: #fff; font-weight: 600; font-size: 15px; text-align: center; position: relative; }
.rail-btn.primary { background: var(--dark); }
.rail-btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line-2); font-weight: 500; padding: 8px 10px; font-size: 14px; }
.rail-btn.next { box-shadow: 0 0 0 3px #bcd3f7; background: #3b4252; }
.rail-btn.listening { background: #c73c3c; }
.rail-btn .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #fff; margin-right: 8px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.rail-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
.rail-small { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 7px 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.rail-small.off { color: var(--muted); }
.rail-note { font-size: 12px; color: var(--muted); line-height: 1.4; }
.rail-note.center { text-align: center; }
.rail-note .rec { color: var(--danger); font-weight: 700; }
.rail-warn { font-size: 12px; color: var(--danger); }
.rail-warn.ok { color: #1d6f3f; }
.rail-text { width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; resize: none; background: var(--surface); min-height: 56px; }
.rail-hint { font-size: 11px; color: var(--muted); }
.rail-select { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.rail-select select { flex: 1; min-width: 0; border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 8px; background: var(--surface); font-size: 13px; color: var(--fg); }
.ai-status { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; line-height: 1.35; }
.ai-status.ok { color: #1d6f3f; }


/* main card */
.card { background: var(--surface); border-radius: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: grid; grid-template-columns: 360px minmax(0, 1fr); min-height: 0; overflow: hidden; }
.left { padding: 24px 22px 20px 26px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
.right { padding: 24px 28px 20px 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.panel-title { font-size: 20px; font-weight: 700; display: inline-block; border-bottom: 2px solid var(--fg); padding-bottom: 2px; margin-bottom: 10px; }

/* workflow */
.wf { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.wf-panel { background: var(--panel); border-radius: 8px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; overflow: auto; }
.wf-group { padding: 4px 6px 6px; border-radius: 6px; }
.wf-group-title { font-weight: 700; font-size: 15px; padding-left: 26px; }
.wf-empty { color: var(--muted); font-size: 13.5px; padding: 8px 6px; }
.wf-step { display: flex; align-items: center; gap: 10px; padding: 3px 6px 3px 2px; border-radius: 6px; margin-left: -2px; }
.wf-step.pending .wf-label { color: #5a5d66; }
.wf-step.done .wf-label { color: var(--ok); font-weight: 600; }
.wf-step.missed { background: #fff1e0; }
.wf-step.missed .wf-label { color: var(--warn); font-weight: 700; }
.wf-step.pop { animation: steppop 1.4s ease-out; }
.wf-group.pop { animation: grouppop 1.6s ease-out; }
@keyframes steppop { 0% { background: #fff7cc; transform: translateX(4px); } 35% { background: #fff1a8; } 100% { transform: none; } }
@keyframes grouppop { 0% { background: #e9f0fc; } 100% { background: transparent; } }
.ico { width: 16px; height: 16px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.ico.ok { color: var(--ok); }
.ico.pend { border: 1.5px solid var(--line-2); border-radius: 50%; width: 13px; height: 13px; margin: 0 1.5px; }
.ico.miss { background: var(--warn); color: #fff; border-radius: 50%; font-size: 11px; font-weight: 800; font-family: var(--mono); width: 15px; height: 15px; }
.wf-label { font-size: 14.5px; }

/* tools */
.tools { flex: none; }
.tools-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid transparent; background: var(--chip); color: var(--chip-fg); border-radius: 5px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; }
.chip.on { background: var(--chip-on); border-color: #e0906a; }
.chip:hover { border-color: #e0906a; }
.chip.flash { animation: chipflash 1.1s ease-in-out infinite; border-color: var(--warn); }
@keyframes chipflash { 0%, 100% { box-shadow: 0 0 0 0 rgba(224,134,26,0); background: var(--chip); } 50% { box-shadow: 0 0 0 5px rgba(224,134,26,.35); background: #fbc9a8; } }
.tools-hint { color: var(--warn); text-transform: none; letter-spacing: 0; font-weight: 600; }

/* tabs */
.tabs { display: flex; gap: 34px; border-bottom: 1px solid var(--line); flex: none; align-items: flex-end; }
.tabs-action { margin-left: auto; padding-bottom: 10px; white-space: nowrap; }
.tab-badge { display: inline-block; margin-left: 8px; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--warn); color: #fff; font-size: 12px; line-height: 20px; text-align: center; vertical-align: 3px; animation: blink 1.2s 3; }
.incoming { background: #e3f3e9; color: #1d6f3f; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.incoming.wide { grid-column: 1 / -1; }
.tab { border: 0; background: transparent; padding: 0 0 8px; font-size: 20px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--fg); border-bottom-color: var(--fg); }
.tabbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* guidance */
.guidance { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; overflow: hidden; }
.tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; }
.tags-label { font-size: 15px; }
.tags-empty { color: var(--muted); font-size: 13px; }
.tag { border: 1.3px solid var(--accent); color: var(--accent); border-radius: 7px; padding: 4px 10px; font-size: 13px; background: var(--surface); }
.gbox { position: relative; background: var(--panel-2); border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 9px; flex: 1 1 0; min-height: 110px; overflow: auto; }
.gbatch { display: flex; flex-direction: column; gap: 10px; flex: none; }
.gbatch.earlier { opacity: .45; }
.gbatch.latest .gcard { animation: cardin .9s ease-out; }
@keyframes cardin { 0% { background: #fff6cf; box-shadow: 0 0 0 4px rgba(224,134,26,.25); } 100% { background: var(--surface); box-shadow: none; } }
.gspacer { flex: none; }
.gcard { font-size: 15px; line-height: 1.5; background: var(--surface); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.gcard.kind-caution { border-left: 4px solid var(--caution); }
.gcard.kind-recommendation { border-left: 4px solid var(--rec); }
.gcard.kind-info { border-left: 4px solid var(--info); }
.gcard.kind-tell { border-left: 4px solid var(--tell); }
.gcard.kind-do { border-left: 4px solid var(--do); }
.gcard.kind-ask { border-left: 4px solid var(--ask); }
.gcard.kind-say, .gcard.kind-answer { border-left: 4px solid var(--answer); }
.gbullets { margin: 0; padding-left: 20px; display: grid; gap: 2px; font-size: 14px; }
.gbullets li::marker { color: var(--muted); }
.kw { font-weight: 700; margin-right: 4px; }
.kw-say { color: var(--say); } .kw-ask { color: var(--ask); } .kw-tell { color: var(--tell); } .kw-info { color: var(--info); }
.kw-do { color: var(--do); } .kw-recommendation { color: var(--rec); } .kw-caution { color: var(--caution); } .kw-answer { color: var(--answer); }
.gsrc { align-self: flex-start; font-size: 11.5px; color: var(--muted); background: var(--panel); border-radius: 4px; padding: 1px 6px; }
.gempty, .gbusy, .gerror, .io-wait { color: var(--muted); font-size: 14px; }
.gbusy { color: var(--accent); }
.gerror { color: var(--danger); background: #fff0ef; border-radius: 8px; padding: 6px 10px; }
.link { border: 0; background: transparent; color: var(--accent); padding: 0; font-size: 13px; text-decoration: underline; }

/* tool I/O: fixed height, scrolls inside */
.toolio-hint { flex: none; color: var(--muted); font-size: 13px; border: 1px dashed var(--line-2); border-radius: 10px; padding: 12px 14px; }
.toolio { flex: 0 1 auto; height: 236px; min-height: 150px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.io-col { display: flex; flex-direction: column; min-height: 0; }
.io-label { color: var(--label); font-weight: 700; font-size: 16px; margin-bottom: 8px; flex: none; }
.io-tool { color: var(--fg); font-weight: 600; }
.io-scroll { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.io-table { width: 100%; border-collapse: collapse; }
.io-table th { text-align: left; font-weight: 700; padding: 8px 12px; border-bottom: 1px solid var(--line); width: 38%; font-size: 13.5px; vertical-align: middle; }
.io-table td { padding: 4px 8px; border-bottom: 1px solid var(--line); }
.io-table tr:last-child th, .io-table tr:last-child td { border-bottom: 0; }
.io-table input, .io-table select { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 6px; }
.io-table input:focus, .io-table select:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.io-actions { display: flex; align-items: center; gap: 14px; margin-top: 8px; flex: none; }
.io-note { font-size: 12px; color: var(--muted); }
.io-out { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
.io-row { display: grid; grid-template-columns: minmax(90px, 36%) 1fr; gap: 8px; font-size: 13.5px; }
.io-row.demo { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-top: 4px; }
.io-k { color: var(--muted); }
.io-v { white-space: pre-line; }

/* buttons */
.btn-dark { border: 0; background: var(--dark); color: #fff; border-radius: 9px; padding: 9px 18px; font-weight: 600; font-size: 14px; }
.btn-dark.big { padding: 12px 20px; font-size: 16px; border-radius: 11px; white-space: nowrap; }
.btn-plain { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 8px 14px; font-weight: 600; }

/* bottom bar */
.bottombar { display: flex; gap: 14px; align-items: stretch; flex: none; padding-top: 2px; }
.ask { flex: 1; display: flex; background: var(--panel-2); border-radius: 11px; padding: 4px 4px 4px 14px; min-width: 0; }
.ask input { flex: 1; border: 0; background: transparent; min-width: 0; font-size: 14.5px; }
.ask input:focus { outline: none; }
.btn-ask { border: 0; background: var(--surface); border-radius: 8px; padding: 0 16px; font-weight: 600; }

/* customer 360 */
.c360 { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 28px; padding-top: 4px; align-content: start; }
.c360 section.wide { grid-column: 1 / -1; }
.c360 h3 { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.kv { margin: 0; display: grid; gap: 4px; }
.kv div { display: grid; grid-template-columns: 130px 1fr; gap: 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.rx { width: 100%; border-collapse: collapse; font-size: 13px; }
.rx th, .rx td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rx th { color: var(--muted); font-weight: 600; }
.hist { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* transcript */
.transcript { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.tline { display: grid; grid-template-columns: 48px 56px 1fr; gap: 10px; align-items: baseline; font-size: 15px; flex: none; }
.tt { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tw { font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.tline.caller .tw { color: var(--accent); }
.tline.agent .tw { color: var(--ok); }
.tline.tool { color: var(--muted); font-size: 13px; }
.tline.tool .tw { color: var(--muted); }
.tline.interim .tx { color: var(--muted); font-style: italic; }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(20,20,24,.35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal { background: var(--surface); border-radius: 16px; padding: 22px 24px; width: min(520px, 100%); max-height: 92vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal h3 { font-size: 18px; }
.modal-status { margin: 0; font-size: 13px; color: var(--muted); }
.modal-status.ok { color: #1d6f3f; }
.modal-help { margin: 0; font-size: 12.5px; color: var(--muted); }
.field { display: grid; gap: 4px; font-size: 13px; }
.field span { color: var(--muted); }
.field input[type=text], .field input[type=password], .field select { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; background: var(--surface); width: 100%; }
.field.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
.field.check span { color: var(--fg); }
.modal-actions { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.modal-test { font-size: 13px; color: var(--fg); background: var(--panel); border-radius: 8px; padding: 8px 10px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--dark); color: #fff; border-radius: 10px; padding: 10px 16px; font-size: 13.5px; z-index: 30; max-width: min(560px, 92vw); box-shadow: 0 6px 20px rgba(0,0,0,.2); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* responsive: the rail becomes a toolbar above the card in narrow windows such as the claude.ai artifact panel */
@media (max-width: 1180px) {
  .stage { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 10px 14px 14px; }
  .rail { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; overflow: visible; padding-right: 0; }
  .rail-top { order: 10; margin-left: auto; }
  .seg { width: 180px; flex: none; }
  .rail-btn { padding: 8px 14px; font-size: 14px; border-radius: 9px; }
  .rail-btn.ghost { padding: 7px 12px; }
  .rail-row { display: flex; gap: 8px; }
  .rail-small { padding: 6px 10px; }
  .rail-note, .rail-hint, .rail-warn { flex: 1 1 100%; }
  .rail-note.center { flex: none; text-align: left; }
  .rail-text { flex: 1 1 220px; width: auto; min-height: 36px; height: 36px; padding: 7px 10px; }
  .rail-select { order: 9; }
  .ai-status { flex: 1 1 100%; border-top: 0; padding-top: 0; order: 11; }
  .card { grid-template-columns: 290px minmax(0, 1fr); }
  .left { padding: 18px 16px 16px 20px; }
  .right { padding: 18px 20px 16px; }
  .panel-title, .tab { font-size: 18px; }
  .tabs { gap: 24px; }
  .wf-label { font-size: 14px; }
  .toolio { display: flex; flex-direction: column; gap: 10px; overflow: auto; height: 240px; min-height: 140px; }
  .io-col { flex: none; display: block; }
  .io-scroll, .io-out { overflow: visible; flex: none; min-height: 0; }
  .gcard { font-size: 14px; }
}
@media (max-width: 720px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  .stage { display: flex; flex-direction: column; }
  .card { display: block; overflow: visible; }
  .left { border-right: 0; border-bottom: 1px solid var(--line); }
  .wf-panel { max-height: 360px; }
  .gbox { max-height: 360px; min-height: 160px; }
  .rail-btn { flex: 1 1 auto; }
  .seg { width: 100%; }
  .rail-top { margin-left: 0; width: 100%; order: -1; }
}
@media (max-width: 600px) {
  .right, .left { padding: 18px 16px; }
  .tabs { gap: 18px; }
  .tab { font-size: 16px; }
  .bottombar { flex-direction: column; }
  .tline { grid-template-columns: 44px 50px 1fr; font-size: 14px; }
}
</style>
<div id="app"></div>

{{kb}}

{{customer}}`,

      if (this.mode === 'sample') return { mode: 'sample', label: 'Claude connected through this page (no key needed)' };

          r = await fetch('api/claude', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ system, user, schema, maxTokens }), signal });

    bestReply(state, user) {

    ask(state, user, question) {

    ping() {

    }
  };

  function sampleErrorText(e) {
    const code = e && e.code;
    switch (code) {
      case 'not_granted': return 'Claude access was not allowed for this page.';
      case 'rate_limited': return 'Claude is rate limited right now; try again in a moment.';
      case 'invalid_json': return 'Claude returned something that was not JSON; try again.';
      case 'cancelled': return 'Cancelled.';
      case 'refused': return 'Claude declined this request.';

    const base = (settings.baseUrl || 'https://api.anthropic.com').replace(/\/+$/, '');

    try {
      res = await fetch(`${base}/v1/messages`, { method: 'POST', headers, body: JSON.stringify(body), signal });
    } catch (e) {
      throw new Error('Could not reach the Claude API (network or CORS). If you are running from a file, serve the folder over http://localhost instead.');

    if (!res.ok) {
      const msg = data && data.error && data.error.message ? data.error.message : `HTTP ${res.status}`;
      throw new Error(msg);

    const block = (data.content || []).find((b) => b.type === 'text');
    if (!block || !block.text) throw new Error('Claude returned no text.');
    try {
      return JSON.parse(block.text);
    } catch (e) {
      throw new Error('Claude returned something that was not JSON.');
    }
  }

  global.AI = AI;
})(window);

/* Phone Assist demo: voice input through the browser's Web Speech API.
   Works in Chrome and Edge. No audio is played back; only you speak. */
(function (global) {
  'use strict';
  const SR = global.SpeechRecognition || global.webkitSpeechRecognition;

  function createRecognizer(handlers) {
    if (!SR) return { supported: false, start() {}, stop() {}, get listening() { return false; } };
    let rec = null;
    let wanted = false;
    let restartTimer = null;

    function makeRec() {
      const r = new SR();
      r.continuous = true;
      r.interimResults = true;
      r.lang = handlers.lang || 'en-US';
      r.maxAlternatives = 1;
      r.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          const txt = res[0].transcript;
          if (res.isFinal) {
            const t = txt.trim();
            if (t) handlers.onFinal(t);
          } else {
            interim += txt;
          }
        }
        handlers.onInterim(interim.trim());
      };
      r.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          wanted = false;
          handlers.onError('Microphone access was blocked. Allow the microphone for this page and try again.');
        } else if (e.error === 'audio-capture') {
          wanted = false;
          handlers.onError('No microphone was found.');
        }
        /* no-speech, network and aborted fall through to onend, which restarts while wanted. */
      };
      r.onend = () => {
        if (wanted) {
          restartTimer = setTimeout(() => {
            try { rec = makeRec(); rec.start(); } catch (err) { wanted = false; handlers.onError(String(err)); handlers.onState('stopped'); }
          }, 150);
        } else {
          handlers.onState('stopped');
        }
      };
      r.onstart = () => handlers.onState('listening');
      return r;
    }

    return {
      supported: true,
      start() {
        if (wanted) return;
        wanted = true;
        try { rec = makeRec(); rec.start(); } catch (err) { wanted = false; handlers.onError(String(err)); }
      },
      stop() {
        wanted = false;
        clearTimeout(restartTimer);
        if (rec) { try { rec.stop(); } catch (e) { /* already stopped */ } }
        handlers.onInterim('');
      },
      get listening() { return wanted; }
    };
  }

  global.Voice = { supported: !!SR, createRecognizer };
})(window);

<script>
/* Phone Assist demo: reads scripted lines aloud with the browser's built-in
   speech synthesis (Chrome, Edge, Safari). Two distinct voices, no vendor. */
(function (global) {
  'use strict';
  const synth = global.speechSynthesis;
  const supported = !!synth && typeof global.SpeechSynthesisUtterance === 'function';
  let voices = [];
  const keep = [];           // Chrome drops onend if the utterance is garbage collected

  function loadVoices() { if (supported) voices = synth.getVoices() || []; }
  if (supported) {
    loadVoices();
    if (typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', loadVoices);
    else synth.onvoiceschanged = loadVoices;
  }

  const PREF = {
    caller: ['Google UK English Female', 'Karen', 'Moira', 'Tessa', 'Microsoft Zira', 'Microsoft Sonia', 'Samantha', 'Google US English'],
    agent: ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Ava', 'Allison', 'Microsoft Zira', 'Google UK English Female']
  };

  function pick(role) {
    if (!voices.length) loadVoices();
    const en = voices.filter((v) => /^en[-_]/i.test(v.lang));
    const pool = en.length ? en : voices;
    if (!pool.length) return null;
    const find = (names) => { for (const n of names) { const v = pool.find((x) => x.name.includes(n)); if (v) return v; } return null; };
    let v = find(PREF[role] || []);
    const other = find(PREF[role === 'caller' ? 'agent' : 'caller'] || []);
    if (!v) v = role === 'caller' ? pool[0] : (pool[1] || pool[0]);
    if (other && v === other) {                       // make sure the two speakers differ when possible
      const alt = pool.find((x) => x !== other);
      if (alt) v = alt;
    }
    return v;
  }

  function speak(text, role) {
    if (!supported || !text) return Promise.resolve(false);
    return new Promise((resolve) => {
      const u = new global.SpeechSynthesisUtterance(text);
      const v = pick(role);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
      u.rate = role === 'caller' ? 1.0 : 1.03;
      u.pitch = role === 'caller' ? 1.08 : 0.92;
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        const i = keep.indexOf(u); if (i >= 0) keep.splice(i, 1);
        resolve(ok);
      };
      u.onend = () => finish(true);
      u.onerror = () => finish(false);
      keep.push(u);
      synth.cancel();
      setTimeout(() => { try { synth.speak(u); } catch (e) { finish(false); } }, 60);
      setTimeout(() => { if (!done && !synth.speaking && !synth.pending) finish(false); }, 1800);   // no voice available
      setTimeout(() => finish(true), Math.min(40000, 4000 + text.length * 95));                     // never hang
    });
  }

  /* ElevenLabs voices via the demo server (POST api/tts), falling back to the browser. */
  let currentAudio = null;
  let serverVoice = false;
  const audioCache = new Map();
  function useServer(on) { serverVoice = !!on; }

  function speakServer(text, role) {
    return new Promise(async (resolve) => {
      let url = audioCache.get(`${role}|${text}`);
      try {
        if (!url) {
          const r = await fetch('api/tts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, voice: role }) });
          if (!r.ok) return resolve(speak(text, role, true));
          url = URL.createObjectURL(await r.blob());
          audioCache.set(`${role}|${text}`, url);
        }
      } catch (e) { return resolve(speak(text, role, true)); }
      const a = new Audio(url);
      currentAudio = a;
      let done = false;
      const finish = (ok) => { if (done) return; done = true; if (currentAudio === a) currentAudio = null; resolve(ok); };
      a.onended = () => finish(true);
      a.onerror = () => finish(false);
      a.play().catch(() => finish(false));
      setTimeout(() => finish(true), Math.min(60000, 5000 + text.length * 120));
    });
  }

  const speakBrowser = speak;
  function speakAny(text, role, forceBrowser) {
    if (serverVoice && !forceBrowser) return speakServer(text, role);
    return speakBrowser(text, role);
  }

  function cancel() {
    if (currentAudio) { try { currentAudio.pause(); } catch (e) { /* ignore */ } currentAudio = null; }
    if (supported) { try { synth.cancel(); } catch (e) { /* ignore */ } }
  }

  global.TTS = { get supported() { return supported || serverVoice; }, speak: speakAny, cancel, useServer, voices: () => voices };
})(window);

    setSteps(d.steps);
    addTags(d.tagsAdd, d.tagsRemove);
    setTools(d.tools);
    if (Object.prototype.hasOwnProperty.call(d, 'suggestTool')) suggestTool(d.suggestTool);
    pushCards(d.guidance);
  }

  function toolContext() {
    const s = Store.get();
    return { user: userById(s.userId), transcript: s.transcript, state: s };
  }

  function selectTool(id) {
    const tool = toolById(id);
    if (!tool) return;
    const ctx = toolContext();
    const inputs = {};
    tool.inputs.forEach((f) => { inputs[f.key] = f.prefill ? (f.prefill(ctx) || '') : ''; });
    Store.set((st) => ({ selectedTool: id, toolInputs: inputs, toolResult: null, tab: 'guidance', suggestedTool: st.suggestedTool === id ? null : st.suggestedTool }));
  }

  async function runTool(id, inputs) {
    const tool = toolById(id);
    if (!tool) return null;
    Store.set((st) => ({ selectedTool: id, toolInputs: inputs, toolResult: null, toolBusy: true, tab: 'guidance', suggestedTool: st.suggestedTool === id ? null : st.suggestedTool }));
    await sleep(700);
    const ctx = toolContext();
    let r;
    try { r = tool.run(inputs, ctx); } catch (e) { r = { output: { Error: String(e.message || e) } }; }
    const output = Object.assign({}, r.output || {}, { demo_mode: 'true' });
    const summary = Object.entries(r.output || {}).slice(0, 2).map(([k, v]) => `${k}: ${v}`).join(' · ');
    addLine('tool', `${tool.label} → ${summary}`);
    Store.set((s) => ({ toolBusy: false, toolResult: output, toolRuns: s.toolRuns.concat([{ id: nextId(), tool: id, inputs, output, t: elapsed() }]) }));
    if (r.stepsDone && r.stepsDone.length) {
      const map = {}; r.stepsDone.forEach((sid) => { map[sid] = 'done'; });
      setSteps(map);
    }
    if (r.tagsAdd) addTags(r.tagsAdd);
    if (effectiveEngine(Store.get()) !== 'ai') pushCards(r.cards);   // with Claude driving, it decides what the result means
    return r;
  }

  function applyAnalysis(res) {
    if (!res || typeof res !== 'object') throw new Error('Empty analysis');
    activateGroups(res.activeGroups || []);
    if (Array.isArray(res.customGroups) && res.customGroups.length) {
      Store.set((s) => {
        let groups = s.groups;
        res.customGroups.forEach((cg) => {
          if (!cg || !cg.id || !cg.title || !Array.isArray(cg.steps) || !cg.steps.length) return;
          const id = String(cg.id).toLowerCase().replace(/[^a-z0-9_]/g, '_').slice(0, 40);
          const steps = cg.steps.filter((st) => st && st.id && st.label).slice(0, 6).map((st) => ({ id: `${id}.${String(st.id)}`, label: String(st.label).slice(0, 80), status: ['done', 'pending', 'missed'].includes(st.status) ? st.status : 'pending' }));
          const existing = groups.find((g) => g.id === id);
          if (existing) {
            groups = groups.map((g) => (g.id === id ? { ...g, active: true, steps: g.steps.map((old) => { const n = steps.find((x) => x.id === old.id); return n && n.status !== old.status ? { ...old, status: n.status, changed: Date.now() } : old; }).concat(steps.filter((n) => !g.steps.some((old) => old.id === n.id))) } : g));
          } else {
            groups = groups.concat([{ id, title: String(cg.title).slice(0, 40), active: true, custom: true, changed: Date.now(), steps }]);
          }
        });
        return { groups };
      });
    }
    const map = {};
    (res.steps || []).forEach((st) => { if (st && st.id && ['done', 'pending', 'missed'].includes(st.status)) map[st.id] = st.status; });
    setSteps(map);
    if (Array.isArray(res.tags)) {
      const tags = res.tags.filter((t) => typeof t === 'string' && t.trim()).map((t) => t.trim()).slice(0, 8);
      Store.set({ tags });
    }
    setTools(res.tools);
    suggestTool(typeof res.suggestedTool === 'string' ? res.suggestedTool.trim() : null);
    const cards = (res.guidance || []).filter((c) => c && c.text && D.GUIDANCE_KINDS.includes(c.kind) && c.kind !== 'say').slice(0, 2);
    pushCards(cards);
  }

  let inFlight = null;
  let pending = false;
  function scheduleAnalysis() {
    if (!AI.available()) return Promise.resolve();
    if (inFlight) { pending = true; return inFlight; }
    inFlight = (async () => {
      do {
        pending = false;
        Store.set({ aiBusy: true, aiError: '' });
        try {
          const s = Store.get();
          const res = await AI.analyze(s, userById(s.userId));
          applyAnalysis(res);
        } catch (e) {
          Store.set({ aiError: e.message || String(e) });
        }
      } while (pending);
      Store.set({ aiBusy: false });
      inFlight = null;
    })();
    return inFlight;
  }

  /* ------------------------------------------------------------------ */
  /* Call control                                                         */
  /* ------------------------------------------------------------------ */
  let currentPlay = null;
  let lastScenarioId = null;
  let lastUserId = null;

  function startCall(opts) {
    opts = opts || {};
    const autoFirst = opts.autoFirst !== false;
    stopVoice();
    TTS.cancel();
    const s = Store.get();
    let scenarioId = null;
    let userId;
    const chosen = opts.userId || (s.incoming !== 'random' ? s.incoming : null);
    if (s.mode === 'scripted') {
      const sc = (opts.scenarioId && scenarioById(opts.scenarioId)) || (chosen && D.SCENARIOS.find((x) => x.userId === chosen)) || pickRandom(D.SCENARIOS, lastScenarioId);
      scenarioId = sc.id;
      userId = sc.userId;
      lastScenarioId = sc.id;
    } else {
      userId = (chosen && userById(chosen).id === chosen) ? chosen : pickRandom(D.USERS, lastUserId).id;
      lastUserId = userId;
    }
    Store.set(Object.assign(freshCall(), { userId, scenarioId, callStatus: 'active', callStart: Date.now(), tab: 'customer', aiStatus: AI.status() }));
    if (s.mode === 'scripted') {
      if (autoFirst) setTimeout(() => { if (Store.get().callStatus === 'active' && Store.get().scriptIndex === 0) playTurn(0, { interrupt: false }); }, 300);
    } else {
      if (!AI.available()) notify('Claude is not connected on this server, so the panels will not update in live mode.');
    }
  }

  function endCall() {
    stopVoice();
    TTS.cancel();
    Store.set({ callStatus: 'ended', autoplay: false, listening: null, interim: '', speaking: null });
  }

  function resetAll() {
    stopVoice();
    TTS.cancel();
    Store.set(Object.assign(freshCall(), { tab: 'guidance', notice: '' }));
  }

  async function speakLine(speaker, text) {
    if (!Store.get().settings.audio || !TTS.supported) return false;
    Store.set({ speaking: speaker });
    try { return await TTS.speak(text, speaker); }
    finally { if (Store.get().speaking === speaker) Store.set({ speaking: null }); }
  }

  async function playTurn(i, opts) {
    const interrupt = !!(opts && opts.interrupt);
    const sc = currentScenario();
    if (!sc) return false;
    const turns = sc.turns;
    if (currentPlay) {
      if (interrupt) TTS.cancel();
      await currentPlay;
    }
    const s = Store.get();
    if (s.callStatus !== 'active' || s.scriptIndex !== i || !turns[i]) return false;
    const turn = turns[i];
    const p = (async () => {
      addLine(turn.speaker, turn.text);
      Store.set({ scriptIndex: i + 1 });
      const speech = speakLine(turn.speaker, turn.text);
      const d = turn.delta || {};
      const engine = effectiveEngine(Store.get());
      const toolRuns = d.tool ? (Array.isArray(d.tool) ? d.tool : [d.tool]) : [];
      for (const t of toolRuns) await runTool(t.id, t.inputs);     // the agent's actions come first
      if (engine === 'script') applyDelta(d);                       // then what the AI noticed
      if (engine === 'ai') await scheduleAnalysis();
      const spoke = await speech;
      if (d.end || i + 1 >= turns.length) Store.set({ callStatus: 'ended', autoplay: false });
      return { played: true, spoke: !!spoke };
    })();
    currentPlay = p;
    try { return await p; } finally { if (currentPlay === p) currentPlay = null; }
  }

  function playNext() {
    const s = Store.get();
    if (s.callStatus !== 'active') return Promise.resolve(false);
    return playTurn(s.scriptIndex, { interrupt: true });
  }

  async function autoplayLoop() {
    while (Store.get().autoplay && Store.get().callStatus === 'active') {
      const sc = currentScenario();
      if (!sc) break;
      const i = Store.get().scriptIndex;
      if (i >= sc.turns.length) break;
      const res = await playTurn(i, { interrupt: false });
      if (!Store.get().autoplay) break;
      if (res && res.played) {
        await sleep(res.spoke ? 450 : Math.min(5200, 1100 + sc.turns[i].text.length * 36));
      } else {
        await sleep(200);
      }
    }
    Store.set({ autoplay: false });
  }

  function toggleAutoplay() {
    const s = Store.get();
    if (s.autoplay) { Store.set({ autoplay: false }); return; }
    if (s.callStatus !== 'active') startCall({ autoFirst: false });
    Store.set({ autoplay: true });
    autoplayLoop();
  }

  function setMode(mode) {
    stopVoice();
    TTS.cancel();
    const s = Store.get();
    if (s.mode === mode) return;
    Store.set(Object.assign(freshCall(), { mode }));
  }

  /* ------------------------------------------------------------------ */
  /* Voice input                                                          */
  /* ------------------------------------------------------------------ */
  const recognizer = Voice.createRecognizer({
    onInterim: (t) => Store.set({ interim: t }),
    onFinal: (t) => { const sp = Store.get().listening; if (sp) addLiveLine(sp, t); },
    onState: (st) => { if (st === 'stopped') Store.set({ listening: null, interim: '' }); },
    onError: (msg) => { Store.set({ listening: null, interim: '', voiceError: msg }); notify(msg); }
  });

  function stopVoice() {
    if (recognizer.listening) recognizer.stop();
    Store.set({ listening: null, interim: '' });
  }

  function addLiveLine(speaker, text) {
    if (Store.get().callStatus !== 'active') return;
    addLine(speaker, text);
    scheduleAnalysis();
  }

  function speakAs(speaker) {
    const s = Store.get();
    if (s.callStatus !== 'active') { notify('Start the call first.'); return; }
    if (s.mode === 'scripted') {
      if (s.autoplay) return;
      const sc = currentScenario();
      const next = sc ? sc.turns[s.scriptIndex] : null;
      if (!next) return;
      if (next.speaker !== speaker) { notify(`The next scripted line belongs to the ${next.speaker === 'caller' ? 'caller' : 'support agent'}.`); return; }
      playNext();
      return;
    }
    if (!recognizer.supported) { notify('Voice input needs Chrome or Edge. Type a line instead.'); return; }
    if (s.listening === speaker) { stopVoice(); return; }
    Store.set({ listening: speaker, voiceError: '' });
    if (!recognizer.listening) recognizer.start();
  }

  /* ------------------------------------------------------------------ */
  /* Best reply and ask                                                   */
  /* ------------------------------------------------------------------ */
  async function getBestReply() {
    const s = Store.get();
    if (s.callStatus === 'idle') { notify('Start the call first.'); return; }
    if (effectiveEngine(s) === 'script') {
      const sc = currentScenario();
      const played = sc ? sc.turns.slice(0, s.scriptIndex).reverse() : [];
      const turn = played.find((t) => t.delta && t.delta.bestReply);
      if (!turn) { notify('No scripted best reply yet. Play a caller line first.'); return; }
      pushCards([{ kind: 'say', text: turn.delta.bestReply, source: 'Best reply' }]);
      return;
    }
    if (!AI.available()) { notify('Connect Claude in Settings to generate a best reply.'); return; }
    Store.set({ bestBusy: true, aiError: '' });
    try {
      const res = await AI.bestReply(Store.get(), userById(s.userId));
      pushCards([{ kind: 'say', text: res.reply, source: res.why ? `Best reply · ${res.why}` : 'Best reply' }]);
    } catch (e) {
      Store.set({ aiError: e.message || String(e) });
    } finally {
      Store.set({ bestBusy: false });
    }
  }

  async function askQuestion(q) {
    const question = (q || '').trim();
    if (!question) return;
    const s = Store.get();
    if (AI.available() && effectiveEngine(s) === 'ai') {
      Store.set({ askBusy: true, aiError: '' });
      try {
        const res = await AI.ask(Store.get(), userById(s.userId), question);
        pushCards([{ kind: 'answer', text: res.answer, source: res.source || `Q: ${question}` }]);
      } catch (e) {
        Store.set({ aiError: e.message || String(e) });
      } finally {
        Store.set({ askBusy: false });
      }
      return;
    }
    const hit = D.CANNED_ANSWERS.find((c) => c.match.test(question));
    if (hit) pushCards([{ kind: 'answer', text: hit.answer, source: hit.source }]);
    else pushCards([{ kind: 'answer', text: 'In scripted mode I answer from the knowledge base only. Ask about coupons, transfers, early refills, flu shots, identity checks or prior authorization, or connect Claude in Settings for free-form questions.', source: `Q: ${question}` }]);
  }

  function updateSettings(patch) {
    const settings = Object.assign({}, Store.get().settings, patch);
    saveSettings(settings);
    AI.configure(settings);
    if (patch.audio === false) TTS.cancel();
    Store.set({ settings, aiStatus: AI.status() });
  }

  /* ------------------------------------------------------------------ */
  /* Components                                                           */
  /* ------------------------------------------------------------------ */
  const KIND_LABEL = { say: 'Say', ask: 'Ask', tell: 'Tell', info: 'Info', do: 'Do', recommendation: 'Recommendation', caution: 'Caution', answer: 'Answer' };

  function useAutoScroll(ref, key) {
    const seen = useRef(false);
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      const behavior = seen.current ? 'smooth' : 'auto';
      seen.current = true;
      try { el.scrollTo({ top: el.scrollHeight, behavior }); } catch (e) { el.scrollTop = el.scrollHeight; }
    }, [key]);
  }

  function StatusPill({ s }) {
    const [, tick] = useState(0);
    useEffect(() => { const id = setInterval(() => tick((n) => n + 1), 1000); return () => clearInterval(id); }, []);
    let text = 'Ready';
    let cls = 'pill';
    if (s.callStatus === 'active') {
      cls = 'pill live';
      if (s.aiBusy) text = 'Analyzing…';
      else if (s.listening) text = `Listening as ${s.listening === 'caller' ? 'Caller' : 'Agent'}`;
      else text = `Call active · ${fmtClock(elapsed())}`;
    } else if (s.callStatus === 'ended') {
      text = `Call ended · ${fmtClock(s.transcript.length ? s.transcript[s.transcript.length - 1].t : 0)}`;
      cls = 'pill ended';
    }
    return html`<span class=${cls}>${text}</span>`;
  }

  function Rail({ s }) {
    const [draft, setDraft] = useState('');
    const scripted = s.mode === 'scripted';
    const active = s.callStatus === 'active';
    const sc = scripted ? scenarioById(s.scenarioId) : null;
    const next = sc ? sc.turns[s.scriptIndex] : null;
    const total = sc ? sc.turns.length : 0;
    const user = userById(s.userId);
    const speakClass = (who) => {
      let c = 'rail-btn';
      if (scripted && active && !s.autoplay && next && next.speaker === who) c += ' next';
      if (!scripted && s.listening === who) c += ' listening';
      return c;
    };
    const send = (who) => { const t = draft.trim(); if (!t) return; if (!active) { notify('Start the call first.'); return; } addLiveLine(who, t); setDraft(''); };
    return html`
      <aside class="rail">
        <div class="rail-top">
          <${StatusPill} s=${s} />
          <button class="icon-btn" title="Settings" aria-label="Settings" onClick=${() => Store.set({ settingsOpen: true })}>⚙</button>
        </div>
        <div class="seg">
          <button class=${scripted ? 'on' : ''} onClick=${() => setMode('scripted')}>Scripted</button>
          <button class=${!scripted ? 'on' : ''} onClick=${() => setMode('live')}>Live voice</button>
        </div>
        <button class=${'rail-btn ' + (s.callStatus === 'idle' ? 'primary' : '')} onClick=${() => startCall()}>${s.callStatus === 'idle' ? 'Start call' : 'New call'}</button>
        <button class=${speakClass('caller')} disabled=${!active || (scripted && s.autoplay)} onClick=${() => speakAs('caller')}>
          ${!scripted && s.listening === 'caller' ? html`<i class="dot"></i>` : ''}Speak as Caller
        </button>
        <button class=${speakClass('agent')} disabled=${!active || (scripted && s.autoplay)} onClick=${() => speakAs('agent')}>
          ${!scripted && s.listening === 'agent' ? html`<i class="dot"></i>` : ''}Speak as Support Agent
        </button>

        ${scripted ? html`
          <div class="rail-row">
            <button class="rail-small" onClick=${toggleAutoplay}>${s.autoplay ? '❚❚ Pause' : '▶ Play all'}</button>
            <button class="rail-small" disabled=${!active || s.autoplay} onClick=${playNext}>Next ▸</button>
          </div>
          <div class="rail-row">
            <button class=${'rail-small ' + (s.settings.audio ? '' : 'off')} title=${TTS.supported ? 'Read the scripted lines aloud' : 'Speech synthesis is not available in this browser'} onClick=${() => updateSettings({ audio: !s.settings.audio })}>${s.settings.audio ? '🔊 Audio on' : '🔇 Audio off'}</button>
            <span class="rail-note center">${sc ? `Turn ${Math.min(s.scriptIndex, total)} of ${total}` : 'Random scenario'}</span>
          </div>
          <div class="rail-note">${sc ? html`<b>${user.phone}</b> · ${sc.title}` : 'Pick an incoming number below, or leave it random.'}</div>
          ${s.settings.audio && !TTS.supported ? html`<div class="rail-warn">No speech synthesis here; lines play silently.</div>` : ''}
        ` : html`
          <div class="rail-note">
            ${recognizer.supported
              ? (s.listening ? html`<span class="rec">● Listening.</span> Speak naturally; each pause becomes a line.` : 'Pick who you are speaking as, then talk. Click again to stop.')
              : 'Voice input needs Chrome or Edge. Type lines below.'}
          </div>
          <div class="rail-note">${active || s.callStatus === 'ended' ? html`Incoming number <b>${user.phone}</b> matched to a record; see Customer 360.` : 'Pick an incoming number below, or leave it random.'}</div>
          <textarea id="live-draft" class="rail-text" rows="2" placeholder="Or type a line here…" value=${draft} onInput=${(e) => setDraft(e.target.value)}
            onKeyDown=${(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(e.altKey ? 'agent' : 'caller'); } }}></textarea>
          <div class="rail-row">
            <button class="rail-small" disabled=${!active} onClick=${() => send('caller')}>Send as Caller</button>
            <button class="rail-small" disabled=${!active} onClick=${() => send('agent')}>Send as Agent</button>
          </div>
          <div class="rail-hint">Enter sends as caller, Alt+Enter as agent.</div>
        `}

        <label class="rail-select" title="Which phone number the simulated call comes from">
          <span>Incoming number</span>
          <select value=${s.incoming} disabled=${active} onChange=${(e) => Store.set({ incoming: e.target.value })}>
            <option value="random">Random</option>
            ${D.USERS.map((u) => html`<option key=${u.id} value=${u.id}>${u.phone}</option>`)}
          </select>
        </label>
        <div class="rail-row">
          <button class="rail-btn ghost" disabled=${!active} onClick=${endCall}>End call</button>
          <button class="rail-btn ghost" disabled=${s.callStatus === 'idle' && !s.transcript.length} onClick=${resetAll}>Reset</button>
        </div>
        <div class=${'ai-status ' + (AI.available() ? 'ok' : '')} title=${s.aiStatus.label}>${s.aiStatus.label}</div>
      </aside>`;
  }

  function StepIcon({ status }) {
    if (status === 'done') return html`<svg class="ico ok" viewBox="0 0 14 14" aria-label="done"><polyline points="2,7 6,11 12,3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    if (status === 'missed') return html`<span class="ico miss" aria-label="missed">!</span>`;
    return html`<span class="ico pend" aria-label="pending"></span>`;
  }

  function Workflow({ s }) {
    const groups = s.groups.filter((g) => g.active);
    return html`
      <div class="wf">
        <h2 class="panel-title">Workflow Steps</h2>
        <div class="wf-panel">
          ${groups.length ? '' : html`<div class="wf-empty">${s.callStatus === 'idle' ? 'Steps appear once a call starts and the caller says what they need.' : 'Listening for what the caller needs…'}</div>`}
          ${groups.map((g) => html`
            <div key=${g.id + ':' + (g.changed || 0)} class=${'wf-group' + (g.changed ? ' pop' : '')}>
              <div class="wf-group-title">${g.title}</div>
              ${g.steps.map((st) => html`
                <div key=${st.id + ':' + (st.changed || 0)} class=${'wf-step ' + st.status + (st.changed ? ' pop' : '')}>
                  <${StepIcon} status=${st.status} />
                  <span class="wf-label">${st.label}</span>
                </div>`)}
            </div>`)}
        </div>
      </div>`;
  }

  function ToolStrip({ s }) {
    const ids = s.suggestedTool && !s.tools.includes(s.suggestedTool) ? [s.suggestedTool].concat(s.tools) : s.tools;
    return html`
      <div class="tools">
        <div class="tools-label">Contextual tools${s.suggestedTool ? html`<span class="tools-hint"> · ${toolById(s.suggestedTool).label} is needed now</span>` : ''}</div>
        <div class="chips">
          ${ids.map((id) => { const t = toolById(id); const flash = s.suggestedTool === id && s.selectedTool !== id; return html`
            <button key=${id} class=${'chip ' + (s.selectedTool === id ? 'on ' : '') + (flash ? 'flash' : '')} title=${flash ? 'Suggested now: ' + t.description : t.description} onClick=${() => selectTool(id)}>${t.label}</button>`; })}
        </div>
      </div>`;
  }

  function Tabs({ s }) {
    const tab = (id, label, badge) => html`<button class=${'tab ' + (s.tab === id ? 'on' : '')} onClick=${() => Store.set({ tab: id, unseenGuidance: id === 'guidance' ? 0 : s.unseenGuidance })}>${label}${badge ? html`<span class="tab-badge">${badge}</span>` : ''}</button>`;
    return html`<div class="tabs">${tab('guidance', 'Live Guidance', s.tab !== 'guidance' && s.unseenGuidance ? s.unseenGuidance : 0)}${tab('customer', 'Customer 360')}${tab('transcript', 'Transcript')}
      ${s.tab === 'guidance' && s.guidance.length ? html`<button class="link tabs-action" onClick=${() => Store.set({ guidance: [] })}>Clear guidance</button>` : ''}</div>`;
  }

  function GuidanceCard({ c }) {
    return html`
      <div class=${'gcard kind-' + c.kind}>
        <div class="gline">
          <span class=${'kw kw-' + c.kind}>${KIND_LABEL[c.kind] || c.kind}:</span>
          <span class="gtext">${c.text}</span>
        </div>
        ${c.bullets && c.bullets.length ? html`<ul class="gbullets">${c.bullets.map((b, i) => html`<li key=${i}>${b}</li>`)}</ul>` : ''}
        ${c.source ? html`<span class="gsrc">${c.source}</span>` : ''}
      </div>`;
  }

  function GuidanceTab({ s }) {
    const boxRef = useRef(null);
    const lastRef = useRef(null);
    const spacerRef = useRef(null);
    const batches = [];
    s.guidance.forEach((c) => {
      const last = batches[batches.length - 1];
      if (last && last.batch === c.batch) last.cards.push(c);
      else batches.push({ batch: c.batch, cards: [c] });
    });
    const latest = batches.length ? batches[batches.length - 1].batch : 0;
    /* Keep only the newest guidance in view: older batches sit above, reachable by scrolling up. */
    useEffect(() => {
      const box = boxRef.current; const last = lastRef.current; const spacer = spacerRef.current;
      if (!box) return;
      if (!last) { if (spacer) spacer.style.height = '0px'; return; }
      const pad = parseFloat(getComputedStyle(box).paddingTop) || 0;
      const lead = 4;                                   /* the newest card sits 4px below the top edge; the previous one is scrolled out */
      const room = box.clientHeight - lead - pad - last.offsetHeight;
      if (spacer) spacer.style.height = `${Math.max(0, room)}px`;
      const top = last.offsetTop - lead;
      try { box.scrollTo({ top, behavior: batches.length > 1 ? 'smooth' : 'auto' }); } catch (e) { box.scrollTop = top; }
    }, [latest, s.guidance.length, s.aiBusy, s.aiError]);
    return html`
      <div class="guidance">
        <div class="tags">
          <span class="tags-label">Tags:</span>
          ${s.tags.length ? s.tags.map((t) => html`<span key=${t} class="tag">${t}</span>`) : html`<span class="tags-empty">none yet</span>`}
        </div>
        <div class="gbox" ref=${boxRef}>
          ${batches.length
            ? batches.map((b, i) => html`
              <div key=${b.batch} class=${'gbatch ' + (b.batch === latest ? 'latest' : 'earlier')} ref=${i === batches.length - 1 ? lastRef : null}>
                ${b.cards.map((c) => html`<${GuidanceCard} key=${c.id} c=${c} />`)}
              </div>`)
            : html`<div class="gempty">${s.callStatus === 'idle' ? 'Start a call. Only things worth your attention show up here: policy risks, facts the caller needs, offers worth making.' : 'Nothing needs your attention yet.'}</div>`}
          ${s.aiBusy ? html`<div class="gbusy">Claude is updating the screen…</div>` : ''}
          ${s.aiError ? html`<div class="gerror">${s.aiError}</div>` : ''}
          <div class="gspacer" ref=${spacerRef}></div>
        </div>
        <${ToolIO} s=${s} />
      </div>`;
  }

  function ToolIO({ s }) {
    if (!s.selectedTool) {
      return html`<div class="toolio-hint">Click a tool on the left to run it from this screen. Inputs are pre-filled from the customer record and the transcript.</div>`;
    }
    const tool = toolById(s.selectedTool);
    const set = (k, v) => Store.set((st) => ({ toolInputs: Object.assign({}, st.toolInputs, { [k]: v }) }));
    return html`
      <div class="toolio">
        <div class="io-col">
          <div class="io-label">Input: <span class="io-tool">${tool.label}</span></div>
          <div class="io-scroll">
            <table class="io-table">
              ${tool.inputs.map((f) => html`
                <tr key=${f.key}>
                  <th>${f.label}</th>
                  <td>
                    ${f.type === 'select'
                      ? html`<select id=${'in-' + f.key} value=${s.toolInputs[f.key] || ''} onChange=${(e) => set(f.key, e.target.value)}>${f.options.map((o) => html`<option key=${o} value=${o}>${o}</option>`)}</select>`
                      : html`<input id=${'in-' + f.key} type="text" value=${s.toolInputs[f.key] || ''} onInput=${(e) => set(f.key, e.target.value)} />`}
                  </td>
                </tr>`)}
            </table>
          </div>
          <div class="io-actions">
            <button class="btn-dark" disabled=${s.toolBusy || s.callStatus === 'idle'} onClick=${async () => { await runTool(s.selectedTool, Store.get().toolInputs); if (effectiveEngine(Store.get()) === 'ai') scheduleAnalysis(); }}>${s.toolBusy ? 'Running…' : 'Execute'}</button>
            <button class="link" onClick=${() => Store.set({ selectedTool: null, toolResult: null })}>Close</button>
            ${s.callStatus === 'idle' ? html`<span class="io-note">Start a call to run tools.</span>` : ''}
          </div>
        </div>
        <div class="io-col">
          <div class="io-label">Output:</div>
          <div class="io-out">
            ${s.toolBusy ? html`<div class="io-wait">Calling ${tool.label}…</div>` : ''}
            ${!s.toolBusy && s.toolResult ? Object.entries(s.toolResult).map(([k, v]) => html`
              <div key=${k} class=${'io-row ' + (k === 'demo_mode' ? 'demo' : '')}><span class="io-k">${k}</span><span class="io-v">${String(v)}</span></div>`) : ''}
            ${!s.toolBusy && !s.toolResult ? html`<div class="io-wait">Press Execute to call the mock API.</div>` : ''}
          </div>
        </div>
      </div>`;
  }

  function CustomerTab({ s }) {
    const u = userById(s.userId);
    const kv = (rows) => html`<dl class="kv">${rows.map(([k, v]) => html`<div key=${k}><dt>${k}</dt><dd>${v}</dd></div>`)}</dl>`;
    return html`
      <div class="c360">
        ${s.callStatus !== 'idle' ? html`<div class="incoming wide">☏ Incoming call from <b>${u.phone}</b> · matched to <b>${u.name}</b>${s.callStatus === 'ended' ? ' · call ended' : ''}</div>` : ''}
        <section>
          <h3>Profile</h3>
          ${kv([['Name', u.name], ['Date of birth', u.dob], ['Phone', u.phone], ['Email', u.email], ['Preferred contact', u.preferredContact], ['Language', u.language]])}
        </section>
        <section>
          <h3>Preferred store</h3>
          ${kv([['Store', `${u.store.name} ${u.store.id}`], ['Address', u.store.address], ['Phone', u.store.phone], ['Hours', u.store.hours]])}
        </section>
        <section>
          <h3>Insurance</h3>
          ${kv([['Plan', u.insurance.plan], ['Member ID', u.insurance.memberId], ['Group', u.insurance.group], ['Status', u.insurance.status], ['Copay', `${u.insurance.copay30} / 30 days · ${u.insurance.copay90} / 90 days`]])}
        </section>
        <section class="wide">
          <h3>Active prescriptions</h3>
          <table class="rx">
            <thead><tr><th>Rx</th><th>Medication</th><th>Directions</th><th>Supply</th><th>Refills</th><th>Last fill</th><th>Status</th></tr></thead>
            <tbody>${u.prescriptions.map((p) => html`<tr key=${p.rx}><td>${p.rx}</td><td>${p.drug}</td><td>${p.sig}</td><td>${p.qty} / ${p.days} days</td><td>${p.refills}</td><td>${p.lastFill}</td><td>${p.status}</td></tr>`)}</tbody>
          </table>
        </section>
        <section>
          <h3>Allergies and immunizations</h3>
          ${kv([['Allergies', u.allergies.join(', ')], ['Immunizations', u.immunizations.length ? u.immunizations.map((i) => `${i.vaccine} (${i.date})`).join('; ') : 'None on file']])}
        </section>
        <section>
          <h3>Recent interactions</h3>
          <ul class="hist">${u.interactions.map((i) => html`<li key=${i.date + i.channel}><b>${i.date}</b> · ${i.channel}: ${i.summary}</li>`)}</ul>
        </section>
        <section class="wide">
          <h3>Notes</h3>
          <p>${u.notes}</p>
        </section>
      </div>`;
  }

  function TranscriptTab({ s }) {
    const boxRef = useRef(null);
    useAutoScroll(boxRef, `${s.transcript.length}|${s.interim}`);
    return html`
      <div class="transcript" ref=${boxRef}>
        ${s.transcript.length ? '' : html`<div class="gempty">${s.callStatus === 'idle' ? 'The live transcript appears here once the call starts.' : 'Waiting for the first line…'}</div>`}
        ${s.transcript.map((l) => html`
          <div key=${l.id} class=${'tline ' + l.speaker}>
            <span class="tt">${fmtClock(l.t)}</span>
            <span class="tw">${l.speaker === 'caller' ? 'Caller' : l.speaker === 'agent' ? 'Agent' : 'Tool'}</span>
            <span class="tx">${l.text}</span>
          </div>`)}
        ${s.interim ? html`<div class=${'tline interim ' + (s.listening || '')}><span class="tt">…</span><span class="tw">${s.listening === 'agent' ? 'Agent' : 'Caller'}</span><span class="tx">${s.interim}</span></div>` : ''}
      </div>`;
  }

  function BottomBar({ s }) {
    const [q, setQ] = useState('');
    const busy = s.askBusy;
    return html`
      <div class="bottombar">
        <button class="btn-dark big" disabled=${s.bestBusy || s.callStatus === 'idle'} onClick=${getBestReply}>${s.bestBusy ? 'Thinking…' : 'Get Best Reply'}</button>
        <form class="ask" onSubmit=${(e) => { e.preventDefault(); if (!busy) { askQuestion(q); setQ(''); } }}>
          <input id="ask-input" type="text" placeholder="Ask the assistant… e.g. can she stack a coupon with insurance?" value=${q} onInput=${(e) => setQ(e.target.value)} />
          <button type="submit" class="btn-ask" disabled=${busy || !q.trim()}>${busy ? '…' : 'Ask'}</button>
        </form>
      </div>`;
  }

  function SettingsModal({ s }) {
    const [form, setForm] = useState(Object.assign({}, s.settings));
    const [test, setTest] = useState('');
    const inArtifact = !!global.claude;
    const f = (k) => (e) => setForm(Object.assign({}, form, { [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value }));
    const save = () => { updateSettings(form); Store.set({ settingsOpen: false }); };
    const runTest = async () => {
      updateSettings(form);
      setTest('Testing…');
      try { const r = await AI.ping(); setTest(r && r.ok ? 'Connected. Claude answered.' : 'Unexpected answer.'); }
      catch (e) { setTest(`Failed: ${e.message || e}`); }
    };
    return html`
      <div class="modal-back" onClick=${(e) => { if (e.target === e.currentTarget) Store.set({ settingsOpen: false }); }}>
        <div class="modal" role="dialog" aria-label="Settings">
          <h3>Settings</h3>
          <p class=${'modal-status ' + (AI.available() ? 'ok' : '')}>${AI.status().label}</p>
          ${AI.mode === 'server' ? html`<p class="modal-help">Claude and the voices run through the demo server; nothing to configure here.</p>` : inArtifact ? html`
            <p class="modal-help">This page is running inside claude.ai, so Claude is reached through the viewer and no API key is needed. Voice input is not available here; type lines in Live mode, or download the folder to run with the microphone.</p>
            <label class="field"><span>Speed</span>
              <select value=${form.tier} onChange=${f('tier')}>
                <option value="quick">Quick (fastest, no deliberation)</option>
                <option value="default">Default (slower, thinks first)</option>
              </select></label>
          ` : html`
            <label class="field"><span>Anthropic API key</span><input type="password" value=${form.apiKey} onInput=${f('apiKey')} placeholder="sk-ant-…" autocomplete="off" /></label>
            <label class="field"><span>Model</span>
              <select value=${form.model} onChange=${f('model')}>
                <option value="claude-opus-5-5">claude-opus-5-5 (default)</option>
                <option value="claude-sonnet-5-5">claude-sonnet-5-5 (faster)</option>
                <option value="claude-haiku-5-5">claude-haiku-5-5 (fastest)</option>
              </select></label>
            <label class="field"><span>Effort</span>
              <select value=${form.effort} onChange=${f('effort')}>
                <option value="low">low (fastest, recommended for live calls)</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
              </select></label>
            <label class="field"><span>API base URL (optional proxy)</span><input type="text" value=${form.baseUrl} onInput=${f('baseUrl')} placeholder="https://api.anthropic.com" /></label>
            <p class="modal-help">The key is kept in this browser's local storage and sent straight to the Claude API from this page. Fine for a laptop demo; use a proxy URL if you would rather not keep the key in the browser.</p>
          `}
          <label class="field check"><input type="checkbox" checked=${form.audio} onChange=${f('audio')} /><span>Read the scripted call aloud</span></label>
          <p class="modal-help">The panels update automatically after every line. Prompts live in the repository under prompts/ (analysis.md, best_reply.md, ask.md).</p>
          <div class="modal-actions">
            <button class="btn-dark" onClick=${save}>Save</button>
            <button class="btn-plain" onClick=${runTest}>Test connection</button>
            <button class="link" onClick=${() => Store.set({ settingsOpen: false })}>Cancel</button>
          </div>
          ${test ? html`<div class="modal-test">${test}</div>` : ''}
        </div>
      </div>`;
  }

  function Toast({ s }) {
    return s.notice ? html`<div class="toast">${s.notice}</div>` : '';
  }

  function App() {
    const s = useStore();
    return html`
      <div class="stage">
        <${Rail} s=${s} />
        <main class="card">
          <section class="left">
            <${Workflow} s=${s} />
            <${ToolStrip} s=${s} />
          </section>
          <section class="right">
            <${Tabs} s=${s} />
            <div class="tabbody">
              ${s.tab === 'guidance' ? html`<${GuidanceTab} s=${s} />` : ''}
              ${s.tab === 'customer' ? html`<${CustomerTab} s=${s} />` : ''}
              ${s.tab === 'transcript' ? html`<${TranscriptTab} s=${s} />` : ''}
            </div>
            <${BottomBar} s=${s} />
          </section>
        </main>
      </div>
      ${s.settingsOpen ? html`<${SettingsModal} s=${s} />` : ''}
      <${Toast} s=${s} />`;
  }

  /* ------------------------------------------------------------------ */
  /* Boot                                                                 */
  /* ------------------------------------------------------------------ */
  AI.onChange((st) => { TTS.useServer(AI.hasVoice()); Store.set({ aiStatus: st }); });
  AI.init(Store.get().settings);
  render(html`<${App} />`, document.getElementById('app'));

  global.PhoneAssist = { Store, startCall, playNext, toggleAutoplay, runTool, selectTool, getBestReply, askQuestion, setMode, speakAs, addLiveLine, resetAll, endCall };
})(window);
</script>
