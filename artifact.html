<title>Phone Assist Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Phone Assist demo: Cignara playground look (light, single theme).
   One-screen app: the page never scrolls; each panel scrolls inside itself. */
:root {
  --bg: #f1f1f3; --surface: #ffffff; --panel: #f4f4f6; --panel-2: #e4e4e8;
  --fg: #1c1c1f; --muted: #6e7079; --line: #dcdce1; --line-2: #c9c9cf;
  --accent: #2f6fdb; --ok: #2a9d5c; --warn: #e0861a;
  --chip: #fde1d3; --chip-on: #f7c7ae; --chip-fg: #4a2f21;
  --label: #9b59e0; --say: #cf3d3d; --ask: #8a4fd0; --tell: #c9582b; --info: #2a9d5c; --do: #d98a1c; --rec: #6f52d8; --caution: #d33c2f; --answer: #2f6fdb;
  --btn: #8f93a1; --dark: #101114; --danger: #d33c2f;
  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
h2, h3 { margin: 0; }

/* stage: rail + card fill the viewport */
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; padding: 16px 24px 18px; max-width: 1560px; width: 100%; margin: 0 auto; }
.rail { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; padding-right: 2px; }
.rail-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pill { background: var(--panel-2); border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.live { background: #e3f3e9; color: #1d6f3f; }
.pill.ended { background: #ececef; color: var(--muted); }
.icon-btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; width: 32px; height: 32px; font-size: 16px; flex: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 7px 6px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.rail-btn { border: 0; border-radius: 10px; padding: 12px 14px; background: var(--btn); color: #fff; font-weight: 600; font-size: 15px; text-align: center; position: relative; }
.rail-btn.primary { background: var(--dark); }
.rail-btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line-2); font-weight: 500; padding: 8px 10px; font-size: 14px; }
.rail-btn.next { box-shadow: 0 0 0 3px #bcd3f7; background: #3b4252; }
.rail-btn.listening { background: #c73c3c; }
.rail-btn .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #fff; margin-right: 8px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.rail-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
.rail-small { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 7px 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.rail-small.off { color: var(--muted); }
.rail-note { font-size: 12px; color: var(--muted); line-height: 1.4; }
.rail-note.center { text-align: center; }
.rail-note .rec { color: var(--danger); font-weight: 700; }
.rail-warn { font-size: 12px; color: var(--danger); }
.rail-warn.ok { color: #1d6f3f; }
.rail-text { width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; resize: none; background: var(--surface); min-height: 56px; }
.rail-hint { font-size: 11px; color: var(--muted); }
.rail-select { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.rail-select select { flex: 1; min-width: 0; border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 8px; background: var(--surface); font-size: 13px; color: var(--fg); }
.ai-status { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; line-height: 1.35; }
.ai-status.ok { color: #1d6f3f; }


/* main card */
.card { background: var(--surface); border-radius: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: grid; grid-template-columns: 360px minmax(0, 1fr); min-height: 0; overflow: hidden; }
.left { padding: 24px 22px 20px 26px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
.right { padding: 24px 28px 20px 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.panel-title { font-size: 20px; font-weight: 700; display: inline-block; border-bottom: 2px solid var(--fg); padding-bottom: 2px; margin-bottom: 10px; }

/* workflow */
.wf { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.wf-panel { background: var(--panel); border-radius: 8px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; overflow: auto; }
.wf-group { padding: 4px 6px 6px; border-radius: 6px; }
.wf-group-title { font-weight: 700; font-size: 15px; padding-left: 26px; }
.wf-empty { color: var(--muted); font-size: 13.5px; padding: 8px 6px; }
.wf-step { display: flex; align-items: center; gap: 10px; padding: 3px 6px 3px 2px; border-radius: 6px; margin-left: -2px; }
.wf-step.pending .wf-label { color: #5a5d66; }
.wf-step.done .wf-label { color: var(--ok); font-weight: 600; }
.wf-step.missed { background: #fff1e0; }
.wf-step.missed .wf-label { color: var(--warn); font-weight: 700; }
.wf-step.pop { animation: steppop 1.4s ease-out; }
.wf-group.pop { animation: grouppop 1.6s ease-out; }
@keyframes steppop { 0% { background: #fff7cc; transform: translateX(4px); } 35% { background: #fff1a8; } 100% { transform: none; } }
@keyframes grouppop { 0% { background: #e9f0fc; } 100% { background: transparent; } }
.ico { width: 16px; height: 16px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.ico.ok { color: var(--ok); }
.ico.pend { border: 1.5px solid var(--line-2); border-radius: 50%; width: 13px; height: 13px; margin: 0 1.5px; }
.ico.miss { background: var(--warn); color: #fff; border-radius: 50%; font-size: 11px; font-weight: 800; font-family: var(--mono); width: 15px; height: 15px; }
.wf-label { font-size: 14.5px; }

/* tools */
.tools { flex: none; }
.tools-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid transparent; background: var(--chip); color: var(--chip-fg); border-radius: 5px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; }
.chip.on { background: var(--chip-on); border-color: #e0906a; }
.chip:hover { border-color: #e0906a; }
.chip.flash { animation: chipflash 1.1s ease-in-out infinite; border-color: var(--warn); }
@keyframes chipflash { 0%, 100% { box-shadow: 0 0 0 0 rgba(224,134,26,0); background: var(--chip); } 50% { box-shadow: 0 0 0 5px rgba(224,134,26,.35); background: #fbc9a8; } }
.tools-hint { color: var(--warn); text-transform: none; letter-spacing: 0; font-weight: 600; }

/* tabs */
.tabs { display: flex; gap: 34px; border-bottom: 1px solid var(--line); flex: none; align-items: flex-end; }
.tabs-action { margin-left: auto; padding-bottom: 10px; white-space: nowrap; }
.tab-badge { display: inline-block; margin-left: 8px; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--warn); color: #fff; font-size: 12px; line-height: 20px; text-align: center; vertical-align: 3px; animation: blink 1.2s 3; }
.incoming { background: #e3f3e9; color: #1d6f3f; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.incoming.wide { grid-column: 1 / -1; }
.tab { border: 0; background: transparent; padding: 0 0 8px; font-size: 20px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--fg); border-bottom-color: var(--fg); }
.tabbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* guidance */
.guidance { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; overflow: hidden; }
.tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; }
.tags-label { font-size: 15px; }
.tags-empty { color: var(--muted); font-size: 13px; }
.tag { border: 1.3px solid var(--accent); color: var(--accent); border-radius: 7px; padding: 4px 10px; font-size: 13px; background: var(--surface); }
.gbox { position: relative; background: var(--panel-2); border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 9px; flex: 1 1 0; min-height: 110px; overflow: auto; }
.gbatch { display: flex; flex-direction: column; gap: 10px; flex: none; }
.gbatch.earlier { opacity: .45; }
.gbatch.latest .gcard { animation: cardin .9s ease-out; }
@keyframes cardin { 0% { background: #fff6cf; box-shadow: 0 0 0 4px rgba(224,134,26,.25); } 100% { background: var(--surface); box-shadow: none; } }
.gspacer { flex: none; }
.gcard { font-size: 15px; line-height: 1.5; background: var(--surface); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.gcard.kind-caution { border-left: 4px solid var(--caution); }
.gcard.kind-recommendation { border-left: 4px solid var(--rec); }
.gcard.kind-info { border-left: 4px solid var(--info); }
.gcard.kind-tell { border-left: 4px solid var(--tell); }
.gcard.kind-do { border-left: 4px solid var(--do); }
.gcard.kind-ask { border-left: 4px solid var(--ask); }
.gcard.kind-say, .gcard.kind-answer { border-left: 4px solid var(--answer); }
.gbullets { margin: 0; padding-left: 20px; display: grid; gap: 2px; font-size: 14px; }
.gbullets li::marker { color: var(--muted); }
.kw { font-weight: 700; margin-right: 4px; }
.kw-say { color: var(--say); } .kw-ask { color: var(--ask); } .kw-tell { color: var(--tell); } .kw-info { color: var(--info); }
.kw-do { color: var(--do); } .kw-recommendation { color: var(--rec); } .kw-caution { color: var(--caution); } .kw-answer { color: var(--answer); }
.gsrc { align-self: flex-start; font-size: 11.5px; color: var(--muted); background: var(--panel); border-radius: 4px; padding: 1px 6px; }
.gempty, .gbusy, .gerror, .io-wait { color: var(--muted); font-size: 14px; }
.gbusy { color: var(--accent); }
.gerror { color: var(--danger); background: #fff0ef; border-radius: 8px; padding: 6px 10px; }
.link { border: 0; background: transparent; color: var(--accent); padding: 0; font-size: 13px; text-decoration: underline; }

/* tool I/O: fixed height, scrolls inside */
.toolio-hint { flex: none; color: var(--muted); font-size: 13px; border: 1px dashed var(--line-2); border-radius: 10px; padding: 12px 14px; }
.toolio { flex: 0 1 auto; height: 236px; min-height: 150px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.io-col { display: flex; flex-direction: column; min-height: 0; }
.io-label { color: var(--label); font-weight: 700; font-size: 16px; margin-bottom: 8px; flex: none; }
.io-tool { color: var(--fg); font-weight: 600; }
.io-scroll { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.io-table { width: 100%; border-collapse: collapse; }
.io-table th { text-align: left; font-weight: 700; padding: 8px 12px; border-bottom: 1px solid var(--line); width: 38%; font-size: 13.5px; vertical-align: middle; }
.io-table td { padding: 4px 8px; border-bottom: 1px solid var(--line); }
.io-table tr:last-child th, .io-table tr:last-child td { border-bottom: 0; }
.io-table input, .io-table select { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 6px; }
.io-table input:focus, .io-table select:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.io-actions { display: flex; align-items: center; gap: 14px; margin-top: 8px; flex: none; }
.io-note { font-size: 12px; color: var(--muted); }
.io-out { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
.io-row { display: grid; grid-template-columns: minmax(90px, 36%) 1fr; gap: 8px; font-size: 13.5px; }
.io-row.demo { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-top: 4px; }
.io-k { color: var(--muted); }
.io-v { white-space: pre-line; }

/* buttons */
.btn-dark { border: 0; background: var(--dark); color: #fff; border-radius: 9px; padding: 9px 18px; font-weight: 600; font-size: 14px; }
.btn-dark.big { padding: 12px 20px; font-size: 16px; border-radius: 11px; white-space: nowrap; }
.btn-plain { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 8px 14px; font-weight: 600; }

/* bottom bar */
.bottombar { display: flex; gap: 14px; align-items: stretch; flex: none; padding-top: 2px; }
.ask { flex: 1; display: flex; background: var(--panel-2); border-radius: 11px; padding: 4px 4px 4px 14px; min-width: 0; }
.ask input { flex: 1; border: 0; background: transparent; min-width: 0; font-size: 14.5px; }
.ask input:focus { outline: none; }
.btn-ask { border: 0; background: var(--surface); border-radius: 8px; padding: 0 16px; font-weight: 600; }

/* customer 360 */
.c360 { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 28px; padding-top: 4px; align-content: start; }
.c360 section.wide { grid-column: 1 / -1; }
.c360 h3 { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.kv { margin: 0; display: grid; gap: 4px; }
.kv div { display: grid; grid-template-columns: 130px 1fr; gap: 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.rx { width: 100%; border-collapse: collapse; font-size: 13px; }
.rx th, .rx td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rx th { color: var(--muted); font-weight: 600; }
.hist { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* transcript */
.transcript { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.tline { display: grid; grid-template-columns: 48px 56px 1fr; gap: 10px; align-items: baseline; font-size: 15px; flex: none; }
.tt { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tw { font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.tline.caller .tw { color: var(--accent); }
.tline.agent .tw { color: var(--ok); }
.tline.tool { color: var(--muted); font-size: 13px; }
.tline.tool .tw { color: var(--muted); }
.tline.interim .tx { color: var(--muted); font-style: italic; }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(20,20,24,.35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal { background: var(--surface); border-radius: 16px; padding: 22px 24px; width: min(520px, 100%); max-height: 92vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal h3 { font-size: 18px; }
.modal-status { margin: 0; font-size: 13px; color: var(--muted); }
.modal-status.ok { color: #1d6f3f; }
.modal-help { margin: 0; font-size: 12.5px; color: var(--muted); }
.field { display: grid; gap: 4px; font-size: 13px; }
.field span { color: var(--muted); }
.field input[type=text], .field input[type=password], .field select { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; background: var(--surface); width: 100%; }
.field.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
.field.check span { color: var(--fg); }
.modal-actions { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.modal-test { font-size: 13px; color: var(--fg); background: var(--panel); border-radius: 8px; padding: 8px 10px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--dark); color: #fff; border-radius: 10px; padding: 10px 16px; font-size: 13.5px; z-index: 30; max-width: min(560px, 92vw); box-shadow: 0 6px 20px rgba(0,0,0,.2); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* responsive: the rail becomes a toolbar above the card in narrow windows such as the claude.ai artifact panel */
@media (max-width: 1180px) {
  .stage { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 10px 14px 14px; }
  .rail { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; overflow: visible; padding-right: 0; }
  .rail-top { order: 10; margin-left: auto; }
  .seg { width: 180px; flex: none; }
  .rail-btn { padding: 8px 14px; font-size: 14px; border-radius: 9px; }
  .rail-btn.ghost { padding: 7px 12px; }
  .rail-row { display: flex; gap: 8px; }
  .rail-small { padding: 6px 10px; }
  .rail-note, .rail-hint, .rail-warn { flex: 1 1 100%; }
  .rail-note.center { flex: none; text-align: left; }
  .rail-text { flex: 1 1 220px; width: auto; min-height: 36px; height: 36px; padding: 7px 10px; }
  .rail-select { order: 9; }
  .ai-status { flex: 1 1 100%; border-top: 0; padding-top: 0; order: 11; }
  .card { grid-template-columns: 290px minmax(0, 1fr); }
  .left { padding: 18px 16px 16px 20px; }
  .right { padding: 18px 20px 16px; }
  .panel-title, .tab { font-size: 18px; }
  .tabs { gap: 24px; }
  .wf-label { font-size: 14px; }
  .toolio { display: flex; flex-direction: column; gap: 10px; overflow: auto; height: 240px; min-height: 140px; }
  .io-col { flex: none; display: block; }
  .io-scroll, .io-out { overflow: visible; flex: none; min-height: 0; }
  .gcard { font-size: 14px; }
}
@media (max-width: 720px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  .stage { display: flex; flex-direction: column; }
  .card { display: block; overflow: visible; }
  .left { border-right: 0; border-bottom: 1px solid var(--line); }
  .wf-panel { max-height: 360px; }
  .gbox { max-height: 360px; min-height: 160px; }
  .rail-btn { flex: 1 1 auto; }
  .seg { width: 100%; }
  .rail-top { margin-left: 0; width: 100%; order: -1; }
}
@media (max-width: 600px) {
  .right, .left { padding: 18px 16px; }
  .tabs { gap: 18px; }
  .tab { font-size: 16px; }
  .bottombar { flex-direction: column; }
  .tline { grid-template-columns: 44px 50px 1fr; font-size: 14px; }
}
</style>

<script>
window.PROMPT_FILES = {"prompts":{"system_prompt":"\u003c!-- Starter text taken from the earlier demo. Replace it with your own identity and workflows.\n     HTML comments like this one are stripped before the text reaches the model. -->\n\n# Identity and personality\n\nYou support Walgreens pharmacy customer service (a product demo with mock data; nothing here is real Walgreens policy). You are warm, calm and brief. Privacy comes first: no prescription, claim or health detail is discussed before the caller is verified. You never give clinical advice; clinical questions go to the pharmacist. You never invent prices, eligibility or policy: they come from tool results, the customer record or the knowledge base.\n\n# Workflows\n\nEach workflow is a heading with numbered steps. A step names the tool it uses and the knowledge-base file it follows, when it has one.\n\n## Workflow: Verification\n\nWhen to use: as soon as the caller says what they need, before any prescription detail is discussed.\n\n1. Confirm name and date of birth. Tool: `verify_identity`. Policy: `identity_verification.md`.\n2. Send one-time passcode (SMS). Tool: `send_otp`.\n3. Verify passcode. Tool: `verify_otp`.\n\n## Workflow: Prescription issue\n\nWhen to use: the caller reports a refill, claim or prescription problem.\n\n1. Locate prescription. Tool: `lookup_rx`.\n2. Check refill and claim status. Tool: `check_insurance`. Policy: `refill_timing.md`.\n3. Read rejection reason back to caller. Policy: `insurance_rejection_codes.md`.\n4. Rerun claim or offer alternative. Tool: `rerun_claim`.\n\n## Workflow: Cost and savings\n\nWhen to use: the caller mentions price, copays or affordability.\n\n1. Check 90-day supply eligibility. Tool: `check_insurance`.\n2. Quote copay options. Policy: `cost_and_savings.md`.\n3. Confirm caller's choice.\n\n## Workflow: Immunization\n\nWhen to use: the caller asks about a vaccine or flu shot.\n\n1. Check flu shot eligibility. Tool: `vaccine_slots`. Policy: `immunization_services.md`.\n2. Find appointment slots. Tool: `vaccine_slots`.\n3. Book appointment. Tool: `book_appointment`.\n\n## Workflow: Prescription transfer\n\nWhen to use: the caller wants a prescription moved to or from another pharmacy or store.\n\n1. Confirm receiving store.\n2. Submit transfer request. Tool: `transfer_rx`.\n3. Give transfer timeline. Policy: `prescription_transfers.md`.\n\n## Workflow: Escalation\n\nWhen to use: the caller asks a clinical question, or the issue needs a pharmacist or supervisor.\n\n1. Tell caller a pharmacist will join. Policy: `escalation_and_sensitive_topics.md`.\n2. Warm-transfer to pharmacist. Tool: `page_pharmacist`.\n\n## Workflow: Wrap-up\n\nWhen to use: once the main request is resolved, before hanging up.\n\n1. Confirm pickup store and time.\n2. Send confirmation (text or email). Tool: `send_confirmation`.\n3. Log call summary. Tool: `log_summary`.\n","phone_assist":"\u003c!-- Starter text taken from the earlier demo. Replace it with your own Phone Assist instructions.\n     This file drives the screen (workflow steps, tags, live guidance, which tools to highlight\n     and prefill) and also how a tool call is simulated. -->\n\n# Role\n\nYou are Phone Assist. A human AGENT is on a live phone call with a CALLER. You read the transcript and keep the agent's screen current. You never speak to the caller.\n\n# Workflow steps\n\n- Show only the workflows from the system prompt that apply to this call so far. The screen starts blank: before the caller has said what they need, return no workflows.\n- At the caller's first real request, show Verification plus the workflow for that topic. Add a workflow the moment a new topic comes up. Add Wrap-up once the main request is resolved. Never remove a workflow once shown.\n- Use each workflow's name and step labels exactly as written in the system prompt, and list every step of a shown workflow in order.\n- If the caller's topic has no workflow in the system prompt, invent one with a two or three word name and 2 to 4 concrete steps; keep its name and steps stable once created.\n- Step status:\n  - \"done\" (green) only after the agent actually performed the step: a tool call shows it ran, or the agent's own words show it was said. The caller supplying information does not complete a step on its own; a caller's explicit confirmation of a store, a time or a choice does complete a \"confirm\" step.\n  - \"missed\" (orange) when the agent moved on to a later step or workflow without doing this one, for example rerunning a claim before reading the rejection reason back. If the agent does it later, it becomes \"done\".\n  - otherwise \"pending\".\n\n# Tags\n\nAt most 4 short labels that change how the agent should handle this call or what to document: a verified identity, a plan or coverage fact, a preference on record, a state of the conversation. Prefer this vocabulary: Identity verified, Consent given, Insurance rejection, Price-sensitive, Flu shot request, Transfer request, Escalation needed, Sensitive topic, Policy risk, Controlled substance, Caller frustrated, Hard of hearing, Medicare Part D, New patient, Prefers email, Prefers text, Authorized representative. No tags that merely restate the topic.\n\n# Live guidance\n\nThe agent is on the phone and must not spend time reading. A card appears only when there is something to know or keep in mind for the next thing the agent says or does; otherwise return no cards, which is the normal answer.\n\n- One event (the latest line or tool result) gets at most one card; put several points into bullets. Never more than 2 cards.\n- Text under 18 words; at most 3 bullets of under 12 words each.\n- Kinds:\n  - info: a fact from the customer record or the knowledge base that matters right now.\n  - caution: a compliance or policy risk (detail before verification, a skipped step, a promise the policy does not allow, a clinical question).\n  - recommendation: the next best action or an offer worth making, grounded in the record or a tool result.\n  - tell: a result the agent must relay, with the numbers.\n  - do: an action with a detail that matters (run the 90-day claim, not 30).\n  - ask: a required question that is easy to forget.\n- The card must land before the agent responds, so it is triggered by what the caller just said or what a tool just returned.\n- Do not restate what a trained agent would do anyway, and never repeat a card already on screen unless the situation changed.\n- source: the knowledge-base file name (for example `prescription_transfers.md`), \"Customer record\", or the tool name. Use \"\" when nothing backs the card.\n- Never invent policy, prices or eligibility; use only the knowledge base, the customer record and tool results.\n\n# Tools\n\n- Highlight 3 to 6 tools from tools.md the agent is most likely to need next, most useful first.\n- Prefill every input of each highlighted tool from the conversation or the customer record. Leave an input as \"\" when that information is not available, so the agent can fill it in.\n- suggestedTool: the one tool the agent should run right now because a workflow step needs it, or \"\" when none. Suggest a tool only when the agent is doing or about to do that step and the caller has said, in this call, the details that step checks. Values you can prefill from the customer record do not count: verify_identity waits until the caller has given a date of birth, and verify_otp waits until the caller reads the passcode back.\n- Do not suggest a tool that already ran for the same purpose in this call.\n\n# Simulating a tool call\n\nWhen asked to simulate a tool, you play the tool's backend. The tool is not real; return the JSON object it would return.\n\n- Follow the tool's example output in tools.md: the same keys and structure, with values that fit this call.\n- Stay consistent with the customer record, the transcript and earlier tool results. Reuse identifiers, prices, dates and names already seen; never contradict them.\n- Happy path: lookups find the record, checks pass and actions succeed with a realistic confirmation number, unless the knowledge base or an earlier result says otherwise (a refill that is too soon is rejected again).\n- Use the inputs given. When an input is blank, infer it from the conversation and the record.\n- Keep \"demo_mode\": true as the first key.\n","phone_assist_best_reply":"\u003c!-- Starter text taken from the earlier demo. Used when the agent clicks Get Best Reply. -->\n\n# Role\n\nYou are the Phone Assist copilot for a support AGENT on a live call with a CALLER. The agent clicked Get Best Reply.\n\n# How to reply\n\n- Write the single best next thing for the agent to say right now, responding to the caller's latest message and moving the call forward along the current workflow.\n- 1 to 3 sentences of natural spoken English in the agent's voice.\n- Stay consistent with the knowledge base, the customer record and the tool results. Never invent prices, eligibility or policy.\n- If identity is not verified yet, verify first. If the caller asked a clinical question, hand off to the pharmacist.\n- reply: the words to say. why: under 20 words on why this is the right next line.\n","chat":"\u003c!-- Starter text taken from the earlier demo. Used when the agent types a question in the ask box. -->\n\n# Role\n\nYou are the Phone Assist copilot. The support agent typed a question in the ask box during a call; the caller cannot see it.\n\n# How to answer\n\n- Answer in under 60 words, plainly, using the knowledge base, the customer record, the tool results and the call so far.\n- If the answer is not in those sources, say so rather than guessing.\n- source: the knowledge-base file name when policy is involved (for example `cost_and_savings.md`), \"Customer record\" when it comes from the record, otherwise \"\".\n"},"tools":"\u003c!-- Demo tools. Each \"tool_name( ... ) -> output\" block defines a mock tool the agent can call.\n       desc:    (optional) what the tool does — helps the model decide when to call it\n       input:   (optional) comma-separated argument names the model should provide\n       message: (optional) status text shown to the user while the tool runs\n       dynamic: (optional) true = an AI generates the result at call time so it fits\n                the conversation; the output after -> becomes the format to imitate AND\n                the fallback if generation fails. Omit it (or set false) to always\n                return the output verbatim.\n       auto_approved: always true in this pack: every tool runs without an\n                approval gate. Consent before a binding action is asked for in the\n                conversation, not by the tool.\n       output:  everything after \"->\" until the next block: the text returned to the\n                model, written as pretty-printed multi-line JSON. Static when dynamic\n                is off; the example format when dynamic is on.\n     String values are \"quoted\"; booleans are bare true/false. -->\n\nverify_identity(\n    desc=\"Match the caller's name, date of birth and phone against the patient record before any prescription detail is discussed\",\n    input=\"name, dob, phone\",\n    message=\"Verifying the caller\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"match\": true,\n    \"patient\": \"Maria Lopez\",\n    \"date_of_birth\": \"03/14/1981\",\n    \"identifiers_checked\": \"name, date of birth, phone\",\n    \"next_step\": \"Send a one-time passcode to the phone on file\"\n}\n\nsend_otp(\n    desc=\"Send a six-digit one-time passcode by SMS to the phone number on file\",\n    input=\"phone\",\n    message=\"Sending the passcode\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"sent\": true,\n    \"to\": \"(***) ***-0142\",\n    \"code_demo_only\": \"482913\",\n    \"expires_in\": \"5 minutes\"\n}\n\nverify_otp(\n    desc=\"Check the six-digit passcode the caller reads back\",\n    input=\"code\",\n    message=\"Checking the passcode\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"verified\": true,\n    \"method\": \"SMS one-time passcode\",\n    \"note\": \"Caller may now discuss prescriptions and claims\"\n}\n\nlookup_rx(\n    desc=\"List the patient's prescriptions with refill counts and status, or find one by number or drug name\",\n    input=\"patient, query\",\n    message=\"Looking up prescriptions\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"found\": 1,\n    \"prescriptions\": [\n        {\"rx\": \"7731-2208\", \"drug\": \"Atorvastatin 20 mg tablet\", \"refills_left\": 2, \"last_fill\": \"09/21/2026\", \"status\": \"Refill requested, claim rejected 10/18\"}\n    ]\n}\n\ncheck_insurance(\n    desc=\"Check plan status, the latest claim result and rejection reason, days' supply used, and 30-day versus 90-day copays for a prescription\",\n    input=\"memberId, rx\",\n    message=\"Checking insurance\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"plan\": \"BlueCross BlueShield PPO\",\n    \"plan_status\": \"Active\",\n    \"latest_claim\": \"Rejected, code 79 (refill too soon)\",\n    \"days_supply_used\": \"68%\",\n    \"eligible_date\": \"10/24/2026\",\n    \"copay_30_day\": \"$30.00\",\n    \"copay_90_day\": \"$12.00\",\n    \"prior_authorization\": \"Not required\"\n}\n\nrerun_claim(\n    desc=\"Resubmit the insurance claim for a prescription, optionally as a 90-day supply\",\n    input=\"rx, days\",\n    message=\"Rerunning the claim\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"result\": \"Approved\",\n    \"days_supply\": \"90\",\n    \"copay\": \"$12.00\",\n    \"ready_for_pickup\": \"Today after 4:30 PM\",\n    \"store\": \"Walgreens Main St (#4471)\"\n}\n\nvaccine_slots(\n    desc=\"Check vaccine eligibility and coverage for the patient and list open appointment slots at a store\",\n    input=\"store, vaccine, date\",\n    message=\"Finding vaccine slots\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"eligible\": true,\n    \"last_flu_shot\": \"10/09/2025\",\n    \"coverage\": \"$0 copay\",\n    \"open_slots\": [\"4:40 PM\", \"5:00 PM\", \"5:20 PM\", \"6:10 PM\"],\n    \"walk_in_wait\": \"About 25 minutes\"\n}\n\nbook_appointment(\n    desc=\"Book a vaccine appointment slot for the patient at a store\",\n    input=\"patient, store, vaccine, slot\",\n    message=\"Booking the appointment\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"confirmation\": \"FLU-88213\",\n    \"when\": \"Today 4:40 PM\",\n    \"where\": \"Walgreens Main St (#4471)\",\n    \"bring\": \"Insurance card and photo ID\",\n    \"record\": \"In the app and state registry within 24 hours\"\n}\n\nsend_confirmation(\n    desc=\"Send a confirmation by text message or email using the contact details on file\",\n    input=\"channel, message\",\n    message=\"Sending the confirmation\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"sent\": true,\n    \"channel\": \"SMS\",\n    \"to\": \"(***) ***-0142\",\n    \"message\": \"Walgreens Main St: your prescription is ready for pickup today after 4:30 PM.\"\n}\n\ntransfer_rx(\n    desc=\"Move a prescription to another Walgreens store or request a transfer from another pharmacy\",\n    input=\"rx, destination, from\",\n    message=\"Submitting the transfer\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"request\": \"Submitted\",\n    \"transfer_id\": \"TR-55102\",\n    \"to\": \"Walgreens Davis St (#4488)\",\n    \"ready\": \"In about 15 minutes\"\n}\n\npage_pharmacist(\n    desc=\"Warm-transfer the call to the on-duty pharmacist for a clinical question while the agent stays on the line\",\n    input=\"patient, reason\",\n    message=\"Paging the pharmacist\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"status\": \"Pharmacist paged\",\n    \"pharmacist\": \"R. Chen, PharmD\",\n    \"joining_in\": \"About 2 minutes\",\n    \"reason\": \"Rescue inhaler use 5 to 6 times a day\"\n}\n\nlog_summary(\n    desc=\"Write the call summary to the interaction record\",\n    input=\"summary\",\n    message=\"Logging the call\",\n    dynamic=true,\n    auto_approved=true\n) -> {\n    \"demo_mode\": true,\n    \"logged\": true,\n    \"interaction_id\": \"INT-204411\",\n    \"summary\": \"Maria Lopez: refill-too-soon rejection resolved with a 90-day fill at $12; flu shot booked for 4:40 PM.\"\n}\n","kb":[{"file":"cost_and_savings.md","text":"# Cost and savings options\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nA 90-day supply usually carries a lower combined copay than three 30-day fills; quote both from the insurance check before offering. A 90-day conversion uses the remaining refills on the prescription, so no new prescription is needed while refills remain.\n\nManufacturer coupons cannot be combined with federal plans such as Medicare Part D or Medicaid. A discount card can be used instead of insurance on a given fill, but the two cannot be stacked on the same fill.\n\nGeneric substitution is automatic unless the prescriber marked \"dispense as written\".\n\nAgents may quote prices from the insurance check only, never from memory.\n"},{"file":"escalation_and_sensitive_topics.md","text":"# Escalation and sensitive topics\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nAgents do not give clinical advice. Questions about dosing, side effects, drug interactions, pregnancy or missed doses are warm-transferred to the pharmacist; tell the caller a pharmacist will join and expect a wait of up to 5 minutes.\n\nBilling disputes above 100 dollars, complaints about staff, and any request involving a deceased patient go to a supervisor. If a caller mentions self-harm, stay on the line and follow the crisis protocol.\n\nTreat mental health, HIV, substance use and reproductive health prescriptions as sensitive: confirm the caller is the patient before naming the medication.\n"},{"file":"identity_verification.md","text":"# Caller identity verification\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nBefore any prescription, claim or health detail is discussed, verify the caller with two identifiers from the patient record (full name and date of birth) plus one contact identifier (the phone number on file or a prescription number). Then send a one-time passcode to the phone on file and have the caller read it back.\n\nIf the caller is not the patient, they must be listed as an authorized representative on the record; otherwise offer to call the patient directly.\n\nNever confirm or deny that a prescription exists before verification is complete. Agents may say that they are verifying identity for privacy reasons.\n"},{"file":"immunization_services.md","text":"# Immunization services\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nPharmacists give flu shots to patients aged 3 and up, by appointment or walk-in, during pharmacy hours. Most commercial plans and Medicare Part B cover the seasonal flu vaccine at no cost; confirm coverage from the vaccine eligibility check.\n\nA flu shot can be given at the same visit as a COVID-19 vaccine. Patients should bring an insurance card and photo ID. The immunization record is available in the app and sent to the state registry within 24 hours.\n\nPatients 65 and older are offered the high-dose formulation. Clinical questions about reactions or contraindications go to the pharmacist.\n"},{"file":"insurance_rejection_codes.md","text":"# Insurance rejection codes\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\n- Code 70, product not covered: offer the covered alternative or a cash price.\n- Code 75, prior authorization required: the prescriber must submit the authorization; typical turnaround is 2 to 3 business days.\n- Code 76, plan limit exceeded: the quantity or days' supply is above the plan limit; offer the covered quantity.\n- Code 79, refill too soon: a timing rejection, not a coverage problem; give the eligible date.\n- Code 88, drug utilization review: a safety flag that the pharmacist must review before the claim can be rerun.\n\nAlways read the rejection reason back to the caller in plain words before rerunning a claim.\n"},{"file":"prescription_transfers.md","text":"# Prescription transfers\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nPrescriptions move between Walgreens stores instantly; the receiving store can usually fill within 15 minutes of the request.\n\nTransfers from another pharmacy chain take 1 to 2 business days because the pharmacist must contact the other pharmacy.\n\nControlled substances in Schedule II cannot be transferred and need a new prescription; Schedules III to V can be transferred once.\n\nTo start a transfer, confirm the receiving store, the prescription number or medication name, and the current pharmacy's phone number.\n"},{"file":"refill_timing.md","text":"# Refill timing rules\n\n\u003c!-- Mock demo policy, not real Walgreens policy. -->\n\nInsurance plans reject a refill as \"refill too soon\" (rejection code 79) when too little of the current supply has been used. For non-controlled medications the plan pays once about 75 percent of the days' supply is used; for controlled substances it is 90 percent.\n\nThe eligible date is counted from the last fill date, so a 30-day fill picked up on September 21 becomes eligible on October 24.\n\nEarly refills for travel (\"vacation supply\") need a one-time override that the pharmacist requests from the plan; agents should not promise an override.\n\nConverting to a 90-day supply is processed as a new claim and is not blocked by the refill-too-soon window when the prescription has refills remaining.\n"}]};</script>

<script>
/* Phone Assist demo: model backend.
   1. "server": localhost (or a host) calls GPT-5.6 Luna through server.mjs.
      The browser never holds the OpenAI or ElevenLabs key.
   2. "sample": the page runs inside a claude.ai artifact viewer and uses the
      viewer's own Claude access (no API key). That host cannot call OpenAI.
   Every prompt is assembled from the files: prompts/system_prompt.md plus one
   personality file (phone_assist.md, phone_assist_best_reply.md or chat.md),
   with tools.md, kb/*.md and the customer record attached as reference. */
(function (global) {
  'use strict';

  const STEP_STATUS = ['pending', 'done', 'missed'];
  const GUIDANCE_KINDS = ['say', 'ask', 'tell', 'info', 'do', 'recommendation', 'caution'];

  const ANALYSIS_SCHEMA = {
    type: 'object',
    properties: {
      workflows: {
        type: 'array',
        description: 'Every workflow shown on screen, in order, each with all of its steps.',
        items: {
          type: 'object',
          properties: {
            name: { type: 'string' },
            steps: { type: 'array', items: { type: 'object', properties: { label: { type: 'string' }, status: { type: 'string', enum: STEP_STATUS } }, required: ['label', 'status'], additionalProperties: false } }
          },
          required: ['name', 'steps'], additionalProperties: false
        }
      },
      tags: { type: 'array', items: { type: 'string' } },
      guidance: {
        type: 'array',
        items: {
          type: 'object',
          properties: {
            kind: { type: 'string', enum: GUIDANCE_KINDS },
            text: { type: 'string' },
            bullets: { type: 'array', items: { type: 'string' } },
            source: { type: 'string' }
          },
          required: ['kind', 'text', 'bullets', 'source'], additionalProperties: false
        }
      },
      tools: {
        type: 'array',
        description: 'Tools to highlight, most useful first, each with its inputs prefilled; value is "" when unknown.',
        items: {
          type: 'object',
          properties: {
            name: { type: 'string' },
            inputs: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, value: { type: 'string' } }, required: ['name', 'value'], additionalProperties: false } }
          },
          required: ['name', 'inputs'], additionalProperties: false
        }
      },
      suggestedTool: { type: 'string', description: 'Name of the one tool to run right now, or "".' }
    },
    required: ['workflows', 'tags', 'guidance', 'tools', 'suggestedTool'],
    additionalProperties: false
  };
  const REPLY_SCHEMA = {
    type: 'object',
    properties: { reply: { type: 'string' }, why: { type: 'string' } },
    required: ['reply', 'why'], additionalProperties: false
  };
  const ANSWER_SCHEMA = {
    type: 'object',
    properties: { answer: { type: 'string' }, source: { type: 'string' } },
    required: ['answer', 'source'], additionalProperties: false
  };
  const PING_SCHEMA = { type: 'object', properties: { ok: { type: 'boolean' } }, required: ['ok'], additionalProperties: false };

  /* ---------------- tools.md ---------------- */
  const LABEL_WORDS = { otp: 'OTP', rx: 'Rx', id: 'ID', sms: 'SMS', url: 'URL', dob: 'DOB' };
  function labelFor(name) {
    const words = String(name).replace(/([a-z])([A-Z])/g, '$1_$2').split('_').filter(Boolean);
    return words.map((w, i) => LABEL_WORDS[w.toLowerCase()] || (i === 0 ? w[0].toUpperCase() + w.slice(1) : w.toLowerCase())).join(' ');
  }
  const toolLabel = (name) => String(name).split('_').filter(Boolean).map((w) => LABEL_WORDS[w] || (w[0].toUpperCase() + w.slice(1))).join(' ');

  const stripComments = (text) => String(text || '').replace(/<!--[\s\S]*?-->/g, '').trim();

  function jsonObjectAt(text, start) {
    let depth = 0, inStr = false, esc = false;
    for (let i = start; i < text.length; i++) {
      const ch = text[i];
      if (inStr) {
        if (esc) esc = false;
        else if (ch === '\\') esc = true;
        else if (ch === '"') inStr = false;
        continue;
      }
      if (ch === '"') inStr = true;
      else if (ch === '{') depth++;
      else if (ch === '}' && --depth === 0) return { raw: text.slice(start, i + 1), end: i + 1 };
    }
    return null;
  }

  function withDemoMode(obj) {
    if (!obj || typeof obj !== 'object') return { demo_mode: true };
    if (Array.isArray(obj)) return { demo_mode: true, result: obj };
    const rest = Object.assign({}, obj);
    delete rest.demo_mode;
    return Object.assign({ demo_mode: true }, rest);
  }

  /* Blocks look like: tool_name(\n  desc="...", input="a, b", message="...", dynamic=true\n) -> { example JSON } */
  function parseTools(source) {
    const text = stripComments(source);
    const header = /^([A-Za-z_][A-Za-z0-9_]*)\(\s*\n([\s\S]*?)^\)\s*->\s*/gm;
    const tools = [];
    let m;
    while ((m = header.exec(text))) {
      const args = {};
      for (const line of m[2].split('\n')) {
        const a = line.match(/^\s*(\w+)\s*=\s*("(?:[^"\\]|\\.)*"|true|false)\s*,?\s*$/);
        if (!a) continue;
        args[a[1]] = a[2] === 'true' ? true : a[2] === 'false' ? false : JSON.parse(a[2]);
      }
      const out = text[header.lastIndex] === '{' ? jsonObjectAt(text, header.lastIndex) : null;
      let example = null;
      if (out) {
        try { example = JSON.parse(out.raw); } catch (e) { example = null; }
        header.lastIndex = out.end;
      }
      tools.push({
        id: m[1],
        label: toolLabel(m[1]),
        description: String(args.desc || ''),
        message: String(args.message || ''),
        dynamic: args.dynamic !== false,
        inputs: String(args.input || '').split(',').map((s) => s.trim()).filter(Boolean).map((key) => ({ key, label: labelFor(key) })),
        example: withDemoMode(example)
      });
    }
    return tools;
  }

  /* Strict JSON schema shaped like a tool's example output, so a simulated result keeps its keys. */
  function schemaFor(value) {
    if (Array.isArray(value)) return { type: 'array', items: value.length ? schemaFor(value[0]) : { type: 'string' } };
    if (value && typeof value === 'object') {
      const keys = Object.keys(value);
      const properties = {};
      keys.forEach((k) => { properties[k] = schemaFor(value[k]); });
      return { type: 'object', properties, required: keys, additionalProperties: false };
    }
    if (typeof value === 'boolean') return { type: 'boolean' };
    if (typeof value === 'number') return { type: 'number' };
    return { type: 'string' };
  }

  /* ---------------- prompt pieces ---------------- */
  function customerText(user) {
    if (!user) return 'No customer record selected.';
    const rx = user.prescriptions.map((p) => `  - Rx ${p.rx}: ${p.drug}, ${p.sig}, qty ${p.qty}/${p.days} days, ${p.refills} refills left, last fill ${p.lastFill}, prescriber ${p.prescriber}. Status: ${p.status}`).join('\n');
    const imm = user.immunizations.length ? user.immunizations.map((i) => `${i.vaccine} on ${i.date}`).join('; ') : 'none on file';
    const past = user.interactions.map((i) => `${i.date} (${i.channel}): ${i.summary}`).join('; ');
    return [
      `Name: ${user.name}; DOB ${user.dob}; phone ${user.phone}; email ${user.email}; preferred contact ${user.preferredContact}.`,
      `Preferred store: ${user.store.name} ${user.store.id}, ${user.store.address}, hours ${user.store.hours}.`,
      `Insurance: ${user.insurance.plan}, member ${user.insurance.memberId}, status ${user.insurance.status}, copay ${user.insurance.copay30} per 30 days or ${user.insurance.copay90} per 90 days.`,
      `Prescriptions:\n${rx}`,
      `Allergies: ${user.allergies.join(', ')}. Immunizations: ${imm}.`,
      `Previous interactions: ${past || 'none'}.`,
      `Notes: ${user.notes}`
    ].join('\n');
  }

  function fmtTime(t) {
    const s = Math.max(0, Math.round(t || 0));
    return `[${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}]`;
  }

  function transcriptText(state) {
    if (!state.transcript.length) return '(no lines yet)';
    return state.transcript.map((l) => {
      const who = l.speaker === 'caller' ? 'CALLER' : l.speaker === 'agent' ? 'AGENT' : 'TOOL';
      return `${fmtTime(l.t)} ${who}: ${l.text}`;
    }).join('\n');
  }

  function toolRunsText(state) {
    const runs = state.toolRuns || [];
    if (!runs.length) return 'none';
    return runs.map((r) => `${r.tool}(${JSON.stringify(r.inputs || {})}) -> ${JSON.stringify(r.output || {})}`).join('\n');
  }

  function screenText(state) {
    const wf = state.groups.length
      ? state.groups.map((g) => `- ${g.title}: ${g.steps.map((s, i) => `${i + 1}. ${s.label} [${s.status}]`).join('; ')}`).join('\n')
      : '- none yet';
    return `Workflows on screen:\n${wf}\nTags: ${state.tags.join(', ') || 'none'}.`;
  }

  function kbText() {
    const kb = AI.files.kb;
    return kb.length ? kb.map((k) => `## ${k.file}\n${stripComments(k.text)}`).join('\n\n') : '(no knowledge-base files)';
  }

  /* system_prompt.md + one personality file, then the reference material. */
  function buildSystem(personality, user) {
    const p = AI.files.prompts;
    return [
      stripComments(p.system_prompt),
      stripComments(p[personality]),
      `# Tools (tools.md)\n${stripComments(AI.files.tools) || '(no tools)'}`,
      `# Knowledge base (kb/)\n${kbText()}`,
      `# Customer record (already looked up for this caller)\n${customerText(user)}`
    ].filter(Boolean).join('\n\n---\n\n');
  }

  /* ---------------- backends ---------------- */
  const EMPTY_FILES = { prompts: {}, tools: '', kb: [] };

  const AI = {
    mode: 'none',          // 'server' | 'sample' | 'none'
    sample: null,
    server: null,          // /api/config answer when a demo server is behind this page
    files: EMPTY_FILES,    // prompts/*.md, tools.md and kb/*.md
    tools: [],             // tools parsed from tools.md
    settings: {},
    listeners: new Set(),

    onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
    emit() { this.listeners.forEach((fn) => fn(this.status())); },

    configure(settings) {
      this.settings = settings || {};
      this.recompute();
    },

    recompute() {
      if (this.server && this.server.openai) this.mode = 'server';
      else if (this.sample) this.mode = 'sample';
      else this.mode = 'none';
      this.emit();
    },

    setFiles(files) {
      this.files = {
        prompts: (files && files.prompts) || {},
        tools: (files && files.tools) || '',
        kb: Array.isArray(files && files.kb) ? files.kb : []
      };
      this.tools = parseTools(this.files.tools);
    },

    async init(settings) {
      this.settings = settings || {};
      if (global.PROMPT_FILES) this.setFiles(global.PROMPT_FILES);   // inlined by build-artifact.sh
      this.recompute();
      if (!global.claude && /^https?:/.test(location.protocol)) {
        try {
          const r = await fetch('api/config', { cache: 'no-store' });
          if (r.ok) { const cfg = await r.json(); if (cfg && typeof cfg === 'object') this.server = cfg; }
        } catch (e) { this.server = null; }
        if (this.server) {
          try {
            const r = await fetch('api/prompts', { cache: 'no-store' });
            if (r.ok) this.setFiles(await r.json());
          } catch (e) { /* keep whatever was inlined */ }
        }
        this.recompute();
      }
      if (global.claude && typeof global.claude.use === 'function') {
        try {
          const s = await global.claude.use('sample');
          this.sample = s || null;
        } catch (e) {
          this.sample = null;
        }
        this.recompute();
      }
    },

    available() { return this.mode !== 'none'; },

    hasVoice() { return !!(this.server && this.server.elevenlabs); },

    status() {
      if (this.mode === 'server') {
        const model = this.server.model === 'gpt-5.6-luna' ? 'GPT-5.6 Luna' : (this.server.model || 'GPT-5.6 Luna');
        return { mode: 'server', label: `${model} connected` + (this.server.elevenlabs ? ' · ElevenLabs voices' : ' · browser voices') + (this.server.build && this.server.build.commit ? ` · build ${this.server.build.commit}` : '') };
      }
      if (this.mode === 'sample') return { mode: 'sample', label: 'Claude connected through this page (no key needed)' };
      if (global.claude) return { mode: 'none', label: 'Claude not available in this viewer; the call plays without AI' };
      if (this.server) return { mode: 'none', label: 'Server has no OpenAI key yet; the call plays without AI' };
      return { mode: 'none', label: 'No AI service behind this page; the call plays without AI' };
    },

    async json({ system, user, schema, tier, effort, maxTokens, signal }) {
      if (this.mode === 'server') {
        let r;
        try {
          r = await fetch('api/llm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ system, user, schema, maxTokens, effort: effort || this.settings.effort || 'low' }), signal });
        } catch (e) { throw new Error('Could not reach the demo server.'); }
        const data = await r.json().catch(() => null);
        if (!r.ok) throw new Error((data && data.error) || `Server error ${r.status}`);
        return data.result;
      }
      if (this.mode === 'sample') {
        const prompt = `${system}\n\n---\n\n${user}\n\nReply with only one JSON object that matches this JSON Schema, no prose and no code fence:\n${JSON.stringify(schema)}`;
        try {
          return await this.sample.json(prompt, { modelTier: tier || this.settings.tier || 'quick', cache: false, signal });
        } catch (e) {
          throw new Error(sampleErrorText(e));
        }
      }
      throw new Error('No AI model is connected.');
    },

    analyze(state, user) {
      const shown = (state.guidance || []).slice(-8).map((c) => `- [${c.kind}] ${c.text}`).join('\n') || '- none';
      const prompt = [
        `Call transcript so far (oldest first, [mm:ss] SPEAKER):\n${transcriptText(state)}`,
        `Tool calls so far (name(inputs) -> output):\n${toolRunsText(state)}`,
        `Screen before this update:\n${screenText(state)}`,
        `Cards already on screen (do not repeat them):\n${shown}`,
        'Update the screen for this moment. Return the JSON object.'
      ].join('\n\n');
      return this.json({ system: buildSystem('phone_assist', user), user: prompt, schema: ANALYSIS_SCHEMA, maxTokens: 8000 });
    },

    bestReply(state, user) {
      const prompt = `Call transcript so far:\n${transcriptText(state)}\n\nTool calls so far:\n${toolRunsText(state)}\n\n${screenText(state)}\n\nWrite the agent's best next reply. Return the JSON object.`;
      return this.json({ system: buildSystem('phone_assist_best_reply', user), user: prompt, schema: REPLY_SCHEMA, maxTokens: 2000 });
    },

    ask(state, user, question) {
      const prompt = `Call transcript so far:\n${transcriptText(state)}\n\nTool calls so far:\n${toolRunsText(state)}\n\n${screenText(state)}\n\nThe agent asks: ${question}\n\nReturn the JSON object.`;
      return this.json({ system: buildSystem('chat', user), user: prompt, schema: ANSWER_SCHEMA, maxTokens: 2000 });
    },

    /* Returns { output, simulated, fallback?, error? }. The example output is the fallback. */
    async simulateTool(tool, inputs, state, user) {
      if (!tool.dynamic) return { output: tool.example, simulated: false };
      if (!this.available()) return { output: tool.example, simulated: false, fallback: true, error: 'No AI model is connected.' };
      const prompt = [
        `Simulate this tool call now.\nTool: ${tool.id}\nDescription: ${tool.description}\nInputs given: ${JSON.stringify(inputs || {})}`,
        `Example output (the format to follow):\n${JSON.stringify(tool.example, null, 2)}`,
        `Call transcript so far:\n${transcriptText(state)}`,
        `Earlier tool calls in this call:\n${toolRunsText(state)}`,
        'Return the JSON object this tool returns.'
      ].join('\n\n');
      try {
        const out = await this.json({ system: buildSystem('phone_assist', user), user: prompt, schema: schemaFor(tool.example), maxTokens: 2000 });
        return { output: withDemoMode(out), simulated: true };
      } catch (e) {
        return { output: tool.example, simulated: false, fallback: true, error: e.message || String(e) };
      }
    },

    ping() {
      return this.json({ system: 'You answer connectivity checks.', user: 'Reply with the JSON object {"ok": true}.', schema: PING_SCHEMA, maxTokens: 500 });
    }
  };

  function sampleErrorText(e) {
    const code = e && e.code;
    switch (code) {
      case 'not_granted': return 'Claude access was not allowed for this page.';
      case 'rate_limited': return 'Claude is rate limited right now; try again in a moment.';
      case 'invalid_json': return 'Claude returned something that was not JSON; try again.';
      case 'cancelled': return 'Cancelled.';
      case 'refused': return 'Claude declined this request.';
      default: return (e && e.message) ? e.message : 'Claude request failed.';
    }
  }

  AI.GUIDANCE_KINDS = GUIDANCE_KINDS;
  global.AI = AI;
})(window);
</script>
<script>
/* Phone Assist demo: voice input through the browser's Web Speech API.
   Works in Chrome and Edge. No audio is played back; only you speak. */
(function (global) {
  'use strict';
  const SR = global.SpeechRecognition || global.webkitSpeechRecognition;

  function createRecognizer(handlers) {
    if (!SR) return { supported: false, start() {}, stop() {}, get listening() { return false; } };
    let rec = null;
    let wanted = false;
    let restartTimer = null;

    function makeRec() {
      const r = new SR();
      r.continuous = true;
      r.interimResults = true;
      r.lang = handlers.lang || 'en-US';
      r.maxAlternatives = 1;
      r.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          const txt = res[0].transcript;
          if (res.isFinal) {
            const t = txt.trim();
            if (t) handlers.onFinal(t);
          } else {
            interim += txt;
          }
        }
        handlers.onInterim(interim.trim());
      };
      r.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          wanted = false;
          handlers.onError('Microphone access was blocked. Allow the microphone for this page and try again.');
        } else if (e.error === 'audio-capture') {
          wanted = false;
          handlers.onError('No microphone was found.');
        }
        /* no-speech, network and aborted fall through to onend, which restarts while wanted. */
      };
      r.onend = () => {
        if (wanted) {
          restartTimer = setTimeout(() => {
            try { rec = makeRec(); rec.start(); } catch (err) { wanted = false; handlers.onError(String(err)); handlers.onState('stopped'); }
          }, 150);
        } else {
          handlers.onState('stopped');
        }
      };
      r.onstart = () => handlers.onState('listening');
      return r;
    }

    return {
      supported: true,
      start() {
        if (wanted) return;
        wanted = true;
        try { rec = makeRec(); rec.start(); } catch (err) { wanted = false; handlers.onError(String(err)); }
      },
      stop() {
        wanted = false;
        clearTimeout(restartTimer);
        if (rec) { try { rec.stop(); } catch (e) { /* already stopped */ } }
        handlers.onInterim('');
      },
      get listening() { return wanted; }
    };
  }

  global.Voice = { supported: !!SR, createRecognizer };
})(window);

<script>
/* Phone Assist demo: reads scripted lines aloud with the browser's built-in
   speech synthesis (Chrome, Edge, Safari). Two distinct voices, no vendor. */
(function (global) {
  'use strict';
  const synth = global.speechSynthesis;
  const supported = !!synth && typeof global.SpeechSynthesisUtterance === 'function';
  let voices = [];
  const keep = [];           // Chrome drops onend if the utterance is garbage collected

  function loadVoices() { if (supported) voices = synth.getVoices() || []; }
  if (supported) {
    loadVoices();
    if (typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', loadVoices);
    else synth.onvoiceschanged = loadVoices;
  }

  const PREF = {
    caller: ['Google UK English Female', 'Karen', 'Moira', 'Tessa', 'Microsoft Zira', 'Microsoft Sonia', 'Samantha', 'Google US English'],
    agent: ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Ava', 'Allison', 'Microsoft Zira', 'Google UK English Female']
  };

  function pick(role) {
    if (!voices.length) loadVoices();
    const en = voices.filter((v) => /^en[-_]/i.test(v.lang));
    const pool = en.length ? en : voices;
    if (!pool.length) return null;
    const find = (names) => { for (const n of names) { const v = pool.find((x) => x.name.includes(n)); if (v) return v; } return null; };
    let v = find(PREF[role] || []);
    const other = find(PREF[role === 'caller' ? 'agent' : 'caller'] || []);
    if (!v) v = role === 'caller' ? pool[0] : (pool[1] || pool[0]);
    if (other && v === other) {                       // make sure the two speakers differ when possible
      const alt = pool.find((x) => x !== other);
      if (alt) v = alt;
    }
    return v;
  }

  function speak(text, role) {
    if (!supported || !text) return Promise.resolve(false);
    return new Promise((resolve) => {
      const u = new global.SpeechSynthesisUtterance(text);
      const v = pick(role);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
      u.rate = role === 'caller' ? 1.0 : 1.03;
      u.pitch = role === 'caller' ? 1.08 : 0.92;
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        const i = keep.indexOf(u); if (i >= 0) keep.splice(i, 1);
        resolve(ok);
      };
      u.onend = () => finish(true);
      u.onerror = () => finish(false);
      keep.push(u);
      synth.cancel();
      setTimeout(() => { try { synth.speak(u); } catch (e) { finish(false); } }, 60);
      setTimeout(() => { if (!done && !synth.speaking && !synth.pending) finish(false); }, 1800);   // no voice available
      setTimeout(() => finish(true), Math.min(40000, 4000 + text.length * 95));                     // never hang
    });
  }

  /* ElevenLabs voices via the demo server (POST api/tts), falling back to the browser. */
  let currentAudio = null;
  let serverVoice = false;
  const audioCache = new Map();
  function useServer(on) { serverVoice = !!on; }

  function speakServer(text, role) {
    return new Promise(async (resolve) => {
      let url = audioCache.get(`${role}|${text}`);
      try {
        if (!url) {
          const r = await fetch('api/tts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, voice: role }) });
          if (!r.ok) return resolve(speak(text, role, true));
          url = URL.createObjectURL(await r.blob());
          audioCache.set(`${role}|${text}`, url);
        }
      } catch (e) { return resolve(speak(text, role, true)); }
      const a = new Audio(url);
      currentAudio = a;
      let done = false;
      const finish = (ok) => { if (done) return; done = true; if (currentAudio === a) currentAudio = null; resolve(ok); };
      a.onended = () => finish(true);
      a.onerror = () => finish(false);
      a.play().catch(() => finish(false));
      setTimeout(() => finish(true), Math.min(60000, 5000 + text.length * 120));
    });
  }

  const speakBrowser = speak;
  function speakAny(text, role, forceBrowser) {
    if (serverVoice && !forceBrowser) return speakServer(text, role);
    return speakBrowser(text, role);
  }

  function cancel() {
    if (currentAudio) { try { currentAudio.pause(); } catch (e) { /* ignore */ } currentAudio = null; }
    if (supported) { try { synth.cancel(); } catch (e) { /* ignore */ } }
  }

  global.TTS = { get supported() { return supported || serverVoice; }, speak: speakAny, cancel, useServer, voices: () => voices };
})(window);
